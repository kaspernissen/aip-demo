# SPIRE registration entries for the workloads this repo names explicitly.
#
# No count of "how many workloads get an identity" is written here, for the
# same reason `tests/unit/test_stage2_spire_config.py`'s allow-list docstring
# gives for carrying none: the CRs below are the answer, and prose restating
# how many of them there are only goes stale as more are added.
#
# These are `ClusterSPIFFEID` custom resources, reconciled into real SPIRE
# registration entries by the spire-controller-manager that ships inside the
# `spiffe/spire` 0.30.2 chart (`spire-server.controllerManager.enabled`,
# default true). They are declarative and idempotent, which is what lets
# scripts/setup-kind.sh apply them on every run; `spire-server entry create`
# is neither, and its entries live only in the server's datastore where
# nothing in this repo can review them.
#
# ---------------------------------------------------------------------------
# `className` is NOT optional here, and getting it wrong fails silently.
#
# The chart renders its controller-manager config with
#   className: "northstar-platform-spire"     (release-namespace + release name)
#   watchClassless: false
# -- read from the rendered `spire-controller-manager` ConfigMap, not guessed.
# With `watchClassless: false`, a ClusterSPIFFEID carrying no className is
# ignored outright: `kubectl apply` succeeds, the CR sits there with an empty
# status, no entry is ever created, and the only symptom is a workload that
# cannot fetch an SVID. **Every CR below sets it**, and
# `tests/unit/test_stage2_spire_config.py::test_every_cluster_spiffeid_sets_the_controller_managers_class_name`
# is what makes that true rather than intended -- it walks every
# ClusterSPIFFEID in this file and fails on a missing className.
#
# A comment claiming "every CR below sets it" is itself a stale-count risk,
# since the claim is about a SILENT failure -- a classless CR is never
# reconciled and the only symptom is a workload that cannot fetch an SVID --
# so a reader adding a new CR could be told by this file that they were
# covered when they were not. Hence the test above, not a hand-kept count.
# ---------------------------------------------------------------------------
#
# Why these and not every workload: the chart's own `default` ClusterSPIFFEID
# is a catch-all with `fallback: true` -- it hands every pod an ID of the same
# ns/sa shape, but its namespaceSelector *excludes* northstar-platform (again,
# read from the rendered output), so agentgateway would get no identity at all
# from it. **That exclusion is the rule for this file: a workload in
# northstar-platform needs a CR here or it has no identity; a workload in
# northstar-agents, northstar-tools or northstar-systems gets one from the
# fallback and needs nothing.** Naming the platform workloads explicitly,
# non-fallback, means the identities this repo asserts on are in-tree and
# reviewable rather than an emergent property of a chart default.
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: northstar-settlement-agent
spec:
  className: northstar-platform-spire
  # The same template the chart's own identities use, so settlement-agent's ID
  # is the conventional ns/sa form rather than a bespoke one:
  #   spiffe://northstar.local/ns/northstar-agents/sa/settlement-agent
  # `.PodMeta` / `.PodSpec` are the template context the CRD documents
  # ("The node and pod spec are made available to the template under
  # .NodeSpec, .PodSpec respectively").
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      app: settlement-agent
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: northstar-agents
  # The actual attestation constraint: SPIRE will only hand this SVID to a
  # workload the agent's k8s WorkloadAttestor has attested as running in this
  # namespace under this service account. Without these, the entry's selectors
  # are only whatever the controller-manager derives, and the service-account
  # part of the identity would be decoration in the ID string rather than
  # something SPIRE checks.
  workloadSelectorTemplates:
    - "k8s:ns:{{ .PodMeta.Namespace }}"
    - "k8s:sa:{{ .PodSpec.ServiceAccountName }}"
  # Not a fallback: this must win over the chart's catch-all `default` CR,
  # which matches the same pod (fallback CRs apply only when no non-fallback
  # ClusterSPIFFEID matches).
  fallback: false
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: northstar-agentgateway
spec:
  className: northstar-platform-spire
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      app: agentgateway
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: northstar-platform
  workloadSelectorTemplates:
    - "k8s:ns:{{ .PodMeta.Namespace }}"
    - "k8s:sa:{{ .PodSpec.ServiceAccountName }}"
  fallback: false
---
# The Policy Decision Service. Same template, same two attestation
# selectors, same non-fallback, for the same reasons as the two above; the
# rendered ID is
#   spiffe://northstar.local/ns/northstar-platform/sa/policy-decision-service
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: northstar-policy-decision-service
spec:
  className: northstar-platform-spire
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      app: policy-decision-service
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: northstar-platform
  workloadSelectorTemplates:
    - "k8s:ns:{{ .PodMeta.Namespace }}"
    - "k8s:sa:{{ .PodSpec.ServiceAccountName }}"
  fallback: false
---
# eval-scorer. Same template, same two attestation selectors, same
# non-fallback; the rendered ID is
#   spiffe://northstar.local/ns/northstar-platform/sa/eval-scorer
#
# This one is here because of a MEASURED absence rather than a rule: adding a
# new workload's SPIFFE ID to `tests/unit/test_stage2_spire_config.py`'s
# allow-list is not enough on its own, because the allow-list checks IDs the
# *documents* publish, and nothing published this one -- and, more to the
# point, the identity did not exist. `spire-server entry show` on this
# cluster, with eval-scorer running for hours, listed an entry for every
# other workload and none for it. What matters is the absence, which stays
# reproducible by grepping that output for `eval-scorer`.
#
# The reason is in this file's own header, one namespace further than it went:
# the chart's catch-all `default` CR excludes `northstar-platform`
# (`namespaceSelector.matchExpressions`, `NotIn [northstar-platform,
# spire-server, spire-system]` -- read back off the live CR). So a workload
# added to northstar-platform without a CR of its own gets no identity at all,
# silently. agentgateway and the PDS have one each and that is exactly why;
# `senior-settlement-agent` and `reviewer-ui` needed none because they are in
# northstar-agents, which the fallback does cover. A reader could easily take
# those two as the precedent and conclude a new platform workload needs
# nothing, which is the mistake this comment exists to prevent.
#
# Like the gateway and the PDS, eval-scorer does not *fetch* an SVID: it reads
# OpenSearch over plain HTTP inside the cluster and writes spans to the
# collector, and `deploy/k8s/eval-scorer.yaml` carries no `csi.spiffe.io`
# mount. The identity is registered for the reason stated at the bottom of this
# file -- an identity nothing registers is a string, not an identity -- and
# because this is the one service whose whole job is to judge what other
# identities did. An auditor that cannot itself be named is a poor auditor.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: northstar-eval-scorer
spec:
  className: northstar-platform-spire
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      app: eval-scorer
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: northstar-platform
  workloadSelectorTemplates:
    - "k8s:ns:{{ .PodMeta.Namespace }}"
    - "k8s:sa:{{ .PodSpec.ServiceAccountName }}"
  fallback: false
# NOTE on the gateway entry specifically: agentgateway does NOT fetch this
# SVID, and its pod deliberately carries no Workload API mount. It verifies
# JWT-SVIDs by fetching a JWKS over HTTP; it never presents one. The entry
# exists because the gateway's SPIFFE ID is the *audience*
# settlement-agent's token is minted for
# (deploy/platform/agentgateway/config.yaml `audiences`), so the string has to
# be a real registered identity rather than an invented label -- and because
# the Policy Decision Service may need the gateway's own identity once it
# starts making decisions on this hop. Recorded here rather than left as an
# unexplained resource.
#
# THE SAME NOTE APPLIES, VERBATIM, TO THE PDS ENTRY ADDED ABOVE, and it is
# worth stating rather than leaving a reader to infer it from the missing
# volume: the PDS does not fetch an SVID either, and
# deploy/k8s/policy-decision-service.yaml carries no `csi.spiffe.io` mount.
# It does not need one. The identity it decides *on* is the caller's, handed to
# it by the gateway as an already-verified `jwt.sub`
# (deploy/platform/agentgateway/config.yaml, `metadata: {caller: 'jwt.sub'}`),
# and it presents nothing of its own: the ExtMCP hop between the gateway and
# the PDS is plain gRPC, protected by a CiliumNetworkPolicy rather than by
# mTLS (deploy/platform/cilium-policies.yaml).
#
# So why register it at all? Because the ServiceAccount in
# deploy/k8s/policy-decision-service.yaml exists specifically to make this
# pod's attested identity name it rather than `sa/default`, and an identity
# nothing registers is a string, not an identity. The moment the gateway-to-PDS
# hop gets mTLS -- the obvious next step for a hop that currently trusts the
# dataplane -- this is the entry that makes the PDS's own certificate possible,
# and the identity a future audit record would name as the decider. Registering
# it now costs one CR and keeps the set of identities in this trust domain
# in-tree and reviewable, which is the property this whole file exists for.

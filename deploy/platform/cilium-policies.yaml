# Cilium network policy for stage 2.
#
# The file holds two kinds of policy, and the distinction matters when reading
# it. The first two documents are *ingress* allowlists that make the gateway the
# only way IN to a protected service (payments-mcp, the policy-decision
# service). The last three are *egress* allowlists on the agent plane, which
# make the gateway the only way OUT of an agent to a tool, and the model
# provider reachable from exactly one workload. The section header below the
# second document explains the egress half.
#
# WHY THIS FILE EXISTS
#
# agentgateway sits in the MCP path and verifies a SPIRE-issued JWT-SVID on
# every `tools/call`. That establishes the choke point *by convention*:
# `settlement-agent`'s PAYMENTS_MCP_URL names the gateway, so the agent's
# calls go through it. It does NOT establish the choke point *by
# enforcement* -- nothing stops a workload from ignoring the gateway and
# talking to `payments-mcp` directly.
#
# That gap was measured, not assumed. With no policy applied, `claims-agent` --
# which holds no SVID and has no business touching payments -- POSTed an MCP
# `initialize` straight at
# `payments-mcp.northstar-tools.svc.cluster.local:8000/mcp` and got **HTTP
# 200**. The platform's claim that it decides whether a call becomes an
# effect was therefore true only for a cooperating caller.
#
# `tests/e2e/test_gateway_trace.py::test_the_gateway_is_the_only_route_into_payments_mcp`
# does not catch this, and its docstring is careful about why: it asserts that
# every `payments-mcp` span *in the observed trace* is parented to an
# agentgateway span. That is a statement about the traffic that happened, not
# about the traffic that is possible. Reachability needs the dataplane.
#
# Egress to the model provider is not the same requirement as ingress to the
# tool: "Direct egress from `northstar-agents` to the model provider is
# denied by Cilium" says nothing about ingress to the tool. The architecture
# diagram's note "the gateway is the only path" is attached to the
# `api.anthropic.com` arrow, not to `payments-mcp`.
#
# Cilium is installed precisely so there is a dataplane to put this on.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: payments-mcp-gateway-only
  namespace: northstar-tools
  labels:
    northstar.io/milestone: m2.2
spec:
  # Selects the tool being protected, not the callers. An endpointSelector with
  # an `ingress` block makes this endpoint default-deny for ingress: anything
  # not matched by a rule below is dropped. That is the point -- an allowlist
  # that has to be added to, rather than a denylist that has to anticipate.
  endpointSelector:
    matchLabels:
      app: payments-mcp
  ingress:
    # 1. The gateway, and nothing else in the mesh.
    #
    # Both labels are required and they do different jobs: `app: agentgateway`
    # picks the workload, and the namespace label scopes it, so a pod that
    # happens to label itself `app: agentgateway` in some other namespace does
    # not inherit the gateway's reachability. `k8s:io.kubernetes.pod.namespace`
    # is Cilium's own spelling for the namespace an endpoint lives in.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-platform
            app: agentgateway
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

    # 2. The node itself, for the readiness probe.
    #
    # deploy/k8s/payments-mcp.yaml uses a `tcpSocket` readinessProbe on 8000,
    # and kubelet dials that from the node, not from a pod. Cilium's
    # `allow-localhost: auto` default would very likely cover it, but relying
    # on a default here would mean a probe failure -- which presents as the pod
    # never becoming Ready and `rollout status` hanging -- depends on a setting
    # this repo does not pin. `remote-node` is included for the same reason on
    # a multi-node cluster; this one has a single node today, and the rule
    # costs nothing when there is no remote node to match.
    - fromEntities:
        - host
        - remote-node
---
# The same argument, applied to the Policy Decision Service.
#
# A policy service anything can call is a policy service anything can
# impersonate answers from. The PDS is not a tool and not an agent's
# dependency: exactly one client in this cluster has any business opening a
# connection to it, and that is agentgateway, on the guardrail hook. Everything
# else -- settlement-agent, claims-agent, customer-ui, payments-mcp -- is
# denied by the mere presence of the `ingress` block below.
#
# What a bypass would buy here is different from the payments-mcp case, and
# worth being precise about rather than asserting the same sentence twice.
# Reaching payments-mcp directly skips the decision and moves money. Reaching
# the PDS directly moves nothing -- but the ExtMCP contract is unauthenticated
# on the wire (`add_insecure_port`; no mTLS) and the caller identity the
# policy decides on arrives as a *field in the request*,
# `metadata_context.caller`, which the gateway fills from an already-verified
# `jwt.sub`. So anything that can call this service can claim to be
# settlement-agent and be told, truthfully, what the policy would answer. That
# is an oracle, not an authorisation: a confidentiality problem rather than an
# integrity one. It is closed here, on the dataplane, rather than by adding
# mTLS that this service's pinned dependency closure does not carry.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policy-decision-service-gateway-only
  namespace: northstar-platform
  labels:
    northstar.io/milestone: m2.2
spec:
  # Selects the PDS, not its callers -- and specifically NOT an empty
  # selector, which would match every endpoint in `northstar-platform` and
  # apply default-deny to all of SPIRE (server, agent, CSI driver, OIDC
  # discovery provider) and to agentgateway itself. In this namespace that
  # mistake would not break one service, it would break the trust root.
  endpointSelector:
    matchLabels:
      app: policy-decision-service
  ingress:
    # 1. The gateway, and nothing else in the mesh.
    #
    # Both labels, for the reason spelled out on the payments-mcp rule above.
    # Note that here the caller happens to live in the *same* namespace as the
    # protected endpoint, which makes the namespace label look redundant. It is
    # not: a Cilium `fromEndpoints` selector is not implicitly scoped to the
    # policy's own namespace the way a core NetworkPolicy's `podSelector` is,
    # so without the namespace label this would read "any pod anywhere
    # labelled app: agentgateway".
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-platform
            app: agentgateway
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP

    # 2. The node itself, for the probes -- the one rule in this file whose
    # absence would be actively misleading rather than merely broken.
    #
    # deploy/k8s/policy-decision-service.yaml probes 9100 with `tcpSocket`,
    # and kubelet dials that from the host, not from a pod. Without this the
    # probe is dropped, the pod never goes Ready -- and because the gateway's
    # guardrail is `failureMode: failClosed`, a PDS the gateway cannot reach
    # REFUSES EVERY PAYMENT. The demo would then show every payment refused
    # for entirely the wrong reason, with nothing in the output mentioning
    # networking. `remote-node` is included on the same single-node reasoning
    # as the payments-mcp rule.
    - fromEntities:
        - host
        - remote-node
---
# =============================================================================
# THE EGRESS HALF. The requirement, verbatim: "Direct egress from
# `northstar-agents` to the model provider is **denied** by Cilium, with the
# gateway as the only path."
# =============================================================================
#
# WHAT WAS MEASURED BEFORE THIS EXISTED
#
# Every one of the three workloads in `northstar-agents` opened a TCP
# connection to `api.anthropic.com:443` and to `example.com:443`. Not inferred
# from the absence of a policy -- probed from inside each pod:
#
#   settlement-agent -> api.anthropic.com:443   reached
#   settlement-agent -> example.com:443         reached
#   claims-agent     -> api.anthropic.com:443   reached
#   claims-agent     -> example.com:443         reached
#   customer-ui      -> api.anthropic.com:443   reached   (nc -z, no python)
#
# So the requirement was false in three places, not one. A policy on
# `settlement-agent` alone would have left `claims-agent` and `customer-ui` --
# neither of which has any business near a model provider, and neither of
# which holds an API key -- with wholly unrestricted outbound reachability.
# The requirement names the *namespace*, so all three are policied here, one
# document each.
#
# WHY ONE DOCUMENT PER WORKLOAD, RATHER THAN ONE FOR THE PLANE
#
# `endpointSelector: {matchLabels: {northstar.io/plane: agents}}` would select
# all three in a single document, and every one of them carries that label
# (deploy/k8s/{claims-agent,settlement-agent,customer-ui}.yaml). It was
# rejected: Cilium composes policies by union of allows, so a shared baseline
# would grant `customer-ui` reachability to agentgateway:3000 and
# settlement-agent:9002, and `claims-agent` reachability to agentgateway:3000,
# purely as a side effect of sharing a document. Each of those is an allowance
# nothing measured asked for. Three documents cost more lines and grant less.
#
# THE HAZARD THIS FILE HAS TO GET RIGHT
#
# In Cilium, an endpoint selected by ANY egress rule becomes default-deny for
# egress. There is no partial application: adding the `toFQDNs` allowance for
# the model provider and nothing else would have severed every in-cluster call
# these pods make -- MCP, OTLP, A2A and DNS -- and the demo would have stopped
# working with a cause that reads as anything but a network policy. Each
# document below therefore lists that workload's *complete* outbound
# inventory, taken from its own manifest and source rather than from
# observation of a running pod, so a destination that is configured but rarely
# exercised is still present.
#
# Two things deliberately have no rule anywhere below:
#
#   * The SPIFFE Workload API. `SPIFFE_ENDPOINT_SOCKET` is
#     `unix:///spiffe-workload-api/spire-agent.sock`, a CSI-mounted unix
#     domain socket (deploy/k8s/settlement-agent.yaml:128-129,169-172). UDS
#     IPC never enters the pod's network namespace, so Cilium policy does not
#     govern it. A rule here would be decoration.
#   * Outbound A2A from `settlement-agent`. It is an A2A *server* only;
#     `claims-agent` calls it and it calls nobody back. The 9002 allowance
#     below is on `claims-agent`, the caller -- and 9002 on settlement-agent
#     itself is inbound, which no `egress` block affects.
#
# Reply traffic needs no rule either: Cilium tracks connections in conntrack,
# so the response to an allowed egress connection is not itself re-evaluated.
# Nor do the readiness probes -- kubelet dials those from the node, which is
# ingress to these pods, and no document below carries an `ingress` block, so
# these endpoints stay default-*allow* for ingress exactly as before.
#
# WHAT THIS DOES NOT CLAIM
#
# Cilium enforces reachability, not intent. `settlement-agent` may still reach
# `api.anthropic.com:443`, because that is where its own model call goes --
# the criterion's "gateway as the only path" clause is discharged for *tools*
# (payments-mcp:8000 and the PDS:9100 are absent from every allowlist below,
# so the only route to a tool is agentgateway:3000), and for the model
# provider it is discharged as "one workload, not the namespace". A workload
# that legitimately reaches the model provider can still misuse it; that is
# the guardrail's job, not the dataplane's.
#
# Cilium reports its own behaviour as Prometheus metrics and Hubble flows, not
# as OTLP spans, and Hubble is disabled in this install
# (`enable-hubble: false` in kube-system/cilium-config, read live). Nothing
# below appears in a trace, and no span is invented for it. The evidence for
# these policies is the BPF policy map and probes from inside the pods.
---
# Document 1 of 3: settlement-agent. The only workload in the cluster
# permitted to reach the model provider, and the reason this requirement
# exists.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: settlement-agent-egress-allowlist
  namespace: northstar-agents
  labels:
    northstar.io/milestone: m2.2
spec:
  endpointSelector:
    matchLabels:
      app: settlement-agent
  egress:
    # 1. DNS -- and the rule the `toFQDNs` allowance in 4 silently depends on.
    #
    # Two separate things are happening here and conflating them is how a
    # `toFQDNs` policy fails invisibly.
    #
    # The L3/L4 half (`toEndpoints` + 53/UDP+TCP) is what lets the pod resolve
    # names at all. It selects CoreDNS by label -- `k8s-app: kube-dns`, the
    # label the pods actually carry (read live: `k8s-app=kube-dns,
    # pod-template-hash=...`) -- and NOT by the kube-dns Service ClusterIP.
    # That ClusterIP is `10.96.0.10` on this cluster, but no manifest in this
    # repo asserts that value: deploy/kind/stage2.yaml deliberately leaves
    # serviceSubnet at kind's default, so `10.96.0.10` is a kubeadm allocation
    # convention rather than a pin this repo owns. Hardcoding it here would
    # invent a pin, and would break the moment the range changed with a
    # symptom -- every name resolution failing -- that names neither this file
    # nor the range.
    #
    # The L7 half (`rules.dns`) is what makes `toFQDNs` work. Cilium learns
    # which IPs a name resolves to by watching DNS responses through its own
    # DNS proxy, and the proxy is only interposed on traffic a `rules.dns`
    # block selects. Without this five-line block, rule 4 below matches
    # nothing, the connection to the model provider is dropped, and the
    # policy still reports `VALID: True`. The proxy is gated on
    # `enable-l7-proxy`, confirmed `true` in kube-system/cilium-config on this
    # cluster rather than assumed from the chart default.
    #
    # `matchPattern: "*"` is a deliberate choice, not laziness. A narrower
    # pattern would be a *name allowlist*, which is not what this rule is for
    # -- enforcement happens on the connect (rule 4), not on the lookup. It
    # would also be wrong in a way that is very hard to see: `ClusterFirst`
    # DNS appends search domains, so resolving
    # `agentgateway.northstar-platform.svc.cluster.local` also emits queries
    # for that name suffixed with `northstar-agents.svc.cluster.local` and
    # `svc.cluster.local`, and the DNS proxy DENIES a query no pattern
    # matches. Restricting the pattern therefore breaks resolution through the
    # search list while looking tighter.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # 2. agentgateway, on the MCP port -- and the whole of the "gateway as the
    #    only path" clause, from the other side.
    #
    # `PAYMENTS_MCP_URL` is
    # http://agentgateway.northstar-platform.svc.cluster.local:3000/mcp
    # (deploy/k8s/settlement-agent.yaml:81-82). Note what is NOT in this
    # document: `payments-mcp.northstar-tools.svc.cluster.local:8000`. The
    # first document in this file already blocks that from the ingress side,
    # so the two halves now agree -- and this half survives someone relaxing
    # that one, because there is no rule here to relax. Namespace-pinned for
    # the reason spelled out on the ingress rules above: a pod labelled
    # `app: agentgateway` in some other namespace must not inherit the
    # gateway's position in the path.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-platform
            app: agentgateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    # 3. The OTLP collector. THE RULE WHOSE ABSENCE IS WORST.
    #
    # `OTEL_EXPORTER_OTLP_ENDPOINT` is
    # http://otel-collector.observability.svc.cluster.local:4318 with
    # `OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf`
    # (deploy/k8s/settlement-agent.yaml:48-51), so 4318 and not the 4317 gRPC
    # port the same Service also exposes -- agentgateway uses that one, this
    # agent does not.
    #
    # Dropping this rule would not break the demo. The BatchSpanProcessor
    # exports on a background thread and swallows the failure, so settlements
    # would keep succeeding while every span from this service silently
    # vanished -- in a milestone whose entire claim is that the decision is
    # visible in one trace. That is the failure mode most likely to be mistaken
    # for success, which is why it is called out here rather than left as one
    # of four look-alike rules.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app: otel-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP

    # 4. The model provider, by name -- and nothing else outbound.
    #
    # `api.anthropic.com` is not configured anywhere in this repo. It is the
    # pinned `anthropic` SDK's own default `base_url`
    # (site-packages/anthropic/_client.py: `base_url = f"https://api.anthropic.com"`),
    # reached because settlement.py hands PydanticAI the model
    # `anthropic:claude-sonnet-5` (NORTHSTAR_SETTLEMENT_MODEL,
    # deploy/k8s/settlement-agent.yaml:90-91). No `ANTHROPIC_BASE_URL`
    # override exists in the repo, so this FQDN is the destination in fact,
    # and a rule naming it is a rule about the SDK's behaviour rather than
    # about a value this repo controls -- if that default ever moves, this
    # rule breaks the model call rather than silently permitting a new host.
    #
    # `matchName`, not `matchPattern: "*.anthropic.com"`: exactly one host,
    # so a subdomain that appears later is denied by default rather than
    # inherited.
    #
    # `toFQDNs` is in a rule of its own because Cilium rejects combining it
    # with other L3 selectors in the same rule -- it is not stylistic
    # separation.
    #
    # This is the allowance that makes the criterion a statement about scope
    # rather than about blanket denial. `settlement-agent` may reach this one
    # external name on this one port; documents 2 and 3 below give
    # `claims-agent` and `customer-ui` no external reachability at all; and
    # nothing in the namespace may reach any other external host, which is
    # asserted against `example.com:443` in
    # tests/e2e/test_egress_policy.py rather than argued here.
    - toFQDNs:
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Document 2 of 3: claims-agent.
#
# This is the workload that makes the requirement's own sentence true. Measured
# above: it reached `api.anthropic.com:443`. It holds no API key
# (deploy/k8s/claims-agent.yaml sets no ANTHROPIC_API_KEY and no model
# variable), makes no model call, and its only reason to talk to anything is
# to delegate one A2A message and to export its spans. A policy that closed
# the model-provider path on `settlement-agent` alone would have left this pod
# as an unrestricted egress point sitting in the namespace the criterion
# names.
#
# Its inventory is short and comes from its manifest and source, not from
# watching it run: `delegation.py` builds one `httpx.AsyncClient` against the
# base URL in `NORTHSTAR_ALLOWED_AGENTS` and holds no other peer;
# `bootstrap.py` constructs an `OTLPSpanExporter()` from the OTEL env vars;
# `main.py` only runs uvicorn. There is no Kubernetes API client, no gateway
# call and no tool call anywhere in `agents/claims-agent/`.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claims-agent-egress-allowlist
  namespace: northstar-agents
  labels:
    northstar.io/milestone: m2.2
spec:
  endpointSelector:
    matchLabels:
      app: claims-agent
  egress:
    # 1. DNS -- L3/L4 only, with no `rules.dns` block.
    #
    # Deliberately unlike settlement-agent's rule 1, and the difference is the
    # point: the L7 DNS block exists there to feed `toFQDNs`, and this
    # workload has no `toFQDNs` rule to feed. Adding one here would interpose
    # Cilium's DNS proxy on this pod's lookups to buy nothing, and would make
    # the two documents look like they were doing the same job.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # 2. The one A2A peer it is configured to delegate to.
    #
    # `NORTHSTAR_ALLOWED_AGENTS` is
    # settlement-agent=http://settlement-agent.northstar-agents.svc.cluster.local:9002
    # (deploy/k8s/claims-agent.yaml:43-44). Delegation in this repo is
    # configured and never discovered, so the dataplane can be as narrow as
    # the configuration -- one peer, one port. Same-namespace, and still
    # namespace-pinned: a Cilium `toEndpoints` selector is not implicitly
    # scoped to the policy's namespace the way a core NetworkPolicy's
    # podSelector is.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-agents
            app: settlement-agent
      toPorts:
        - ports:
            - port: "9002"
              protocol: TCP

    # 3. The OTLP collector. Same endpoint and the same silent-failure
    #    argument as settlement-agent's rule 3 --
    #    deploy/k8s/claims-agent.yaml:29-32. This service owns the entry span
    #    of the A2A chain, so losing its export would not empty the trace, it
    #    would decapitate it.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app: otel-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
---
# Document 3 of 3: customer-ui.
#
# The smallest document here and the one most likely to be questioned, so the
# reasoning is explicit. `customer-ui` is nginx serving a static Next.js
# export (`apps/customer-ui/nginx.conf`: one `server` block, `root
# /usr/share/nginx/html`, a `try_files` and no `proxy_pass` anywhere), and the
# browser talks to `claims-agent` directly from the page rather than through
# this pod. Its outbound inventory is therefore genuinely empty.
#
# It is policied anyway because it was measured reaching
# `api.anthropic.com:443`, it carries `northstar.io/plane: agents` in the
# namespace the criterion names, and it runs an Alpine image with `nc` in it
# -- so leaving it out would have left the namespace's easiest outbound path
# open in the pod with a shell. "Needs nothing" is the argument for a policy
# here, not against one.
#
# The DNS allowance is the whole document. Not because nginx needs it -- a
# static server with no upstream resolves nothing -- but because an egress
# block with no rule at all is a shape this file should not carry: it reads as
# an oversight rather than as a decision, and any future addition here would
# start by debugging name resolution. This grants the least that is still
# recognisably a policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: customer-ui-egress-allowlist
  namespace: northstar-agents
  labels:
    northstar.io/milestone: m2.2
spec:
  endpointSelector:
    matchLabels:
      app: customer-ui
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# =============================================================================
# senior-settlement-agent's egress. Same image as settlement-agent, same
# outbound inventory, because "senior-settlement-agent needs exactly what
# settlement-agent has" is the design point (deploy/k8s/
# senior-settlement-agent.yaml's own header): a second Deployment of the
# identical container, not a variant with a different set of calls to make.
#
# THE MEASURED HAZARD, restated for this endpoint specifically: in Cilium,
# ANY egress rule that selects an endpoint makes that endpoint default-deny
# for egress -- there is no partial application. The moment this document's
# `endpointSelector` matches senior-settlement-agent's pod, every outbound
# connection that workload makes has to be listed here or it silently stops
# working, with a symptom (a hung MCP call, a vanished span, a failed model
# call) that names nothing about a network policy. So this is deliberately a
# duplicate of settlement-agent-egress-allowlist's four rules -- DNS
# (L3/L4 plus the `rules.dns` block toFQDNs depends on), agentgateway:3000,
# the OTLP collector:4318, and api.anthropic.com:443 -- rather than a
# `northstar.io/plane: agents`-wide document. A shared document would grant
# settlement-agent's and claims-agent's endpoints reachability neither one
# asked for, purely as a side effect of sharing a selector (the same
# objection this file's egress header already records against one document
# per plane, applied again here).
#
# Behavioural probes are insufficient to prove this is right, only to prove
# it is not obviously wrong: stripping the DNS proxy's `rules.dns` block, and
# separately widening egress to payments-mcp directly, both left every
# behavioural check green while the datapath had actually changed. The
# datapath assertion for this document is
# `cilium-dbg bpf policy get <senior-settlement-agent endpoint id>`, run
# against the live cluster -- not reasoned about from the YAML alone.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: senior-settlement-agent-egress-allowlist
  namespace: northstar-agents
  labels:
    northstar.io/milestone: m3
spec:
  endpointSelector:
    matchLabels:
      app: senior-settlement-agent
  egress:
    # 1. DNS -- L3/L4 to CoreDNS, plus the L7 `rules.dns` block rule 4's
    # `toFQDNs` allowance depends on. See settlement-agent-egress-allowlist's
    # rule 1 above for the full reasoning (CoreDNS selected by label, not
    # ClusterIP; `matchPattern: "*"` because enforcement happens on the
    # connect, not the lookup, and `ClusterFirst` DNS's search-domain
    # expansion means more than one query shape crosses this proxy).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # 2. agentgateway, on the MCP port. senior-settlement-agent's
    # PAYMENTS_MCP_URL is the identical value settlement-agent's carries
    # (deploy/k8s/senior-settlement-agent.yaml) -- same gateway, same "gateway
    # as the only path" argument, from the same identity-agnostic dataplane
    # rule.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-platform
            app: agentgateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    # 3. The OTLP collector. Dropping this would not break the demo -- spans
    # would silently stop leaving this pod while settlements kept succeeding
    # -- which is exactly the failure mode settlement-agent-egress-
    # allowlist's own rule 3 calls out as the one most likely to be mistaken
    # for success.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app: otel-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP

    # 4. The model provider, by name. execute_approved makes no model call
    # (settlement.py), but the same image's decide_settlement path does, and
    # this Deployment runs that exact code -- so the allowance has to be
    # present even though this milestone's approval flow does not exercise
    # it. `matchName`, not a pattern: exactly the one host, same as
    # settlement-agent's own rule 4.
    - toFQDNs:
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# =============================================================================
# The ingress half, for both settlement identities.
#
# Measured, not assumed: `cilium-dbg bpf policy get` on both settlement
# endpoints (177 = settlement-agent, 421 = senior-settlement-agent) showed
# `Allow Ingress ANY` -- neither Deployment had ever gained an ingress policy,
# despite the egress documents above. Combined with `execute_approved` not
# verifying the ledger (the code half of this same finding, closed in
# agents/settlement-agent/settlement.py), anything in the cluster that could
# reach port 9002 could execute any proposed payment up to that identity's
# limit, with no model call and no human. The code fix closes "no review
# happened"; this closes "anything can even ask".
#
# THE MEASURED HAZARD, restated for ingress: exactly as on the egress side,
# ANY rule that selects an endpoint makes that endpoint default-deny in the
# direction the rule is written for. The moment either `endpointSelector`
# below matches, every legitimate caller has to be listed or it silently
# stops working. So each document lists only what is measured to need in,
# right now -- "grant the least that is still recognisably a policy"
# (customer-ui-egress-allowlist's own phrase, applied here to ingress).
#
# settlement-agent (junior): claims-agent is its one real caller today --
# `NORTHSTAR_ALLOWED_AGENTS` in deploy/k8s/claims-agent.yaml names it, and
# claims-agent-egress-allowlist's rule 2 already permits the egress half of
# this exact connection. This document is that allowance's other half.
#
# senior-settlement-agent: reviewer-ui is its one legitimate caller --
# it exists (deploy/k8s/reviewer-ui.yaml), and its POST /review/{payment_id}
# handler is the one and only caller of execute_approved over A2A in this
# repo. The senior-settlement-agent-ingress-allowlist document below grants
# exactly that -- one endpoint, one port (9002) -- plus the readiness probe,
# "grant the least that is still recognisably a policy" applied to a real
# caller rather than a hypothetical one. (A `kubectl port-forward` also
# reaches it for manual verification, the same way the readiness probe does:
# kubelet dials the pod directly from the node, which Cilium classifies as
# `reserved:host`, not as mesh traffic from another endpoint.)
#
# Both readinessProbes are `httpGet` on 9002 (deploy/k8s/settlement-agent.yaml,
# deploy/k8s/senior-settlement-agent.yaml), dialled by kubelet from the node --
# the same `fromEntities: [host, remote-node]` reasoning the payments-mcp and
# policy-decision-service ingress documents above already state in full.
#
# Asserted at the datapath, not just read off this YAML: `cilium-dbg bpf
# policy get` on both endpoints -- the same discipline this file's egress
# header prescribes ("behavioural probes have twice gone green against real
# regressions").
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: settlement-agent-ingress-allowlist
  namespace: northstar-agents
  labels:
    northstar.io/milestone: m3
spec:
  endpointSelector:
    matchLabels:
      app: settlement-agent
  ingress:
    # 1. claims-agent, its one real A2A caller.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-agents
            app: claims-agent
      toPorts:
        - ports:
            - port: "9002"
              protocol: TCP

    # 2. The node itself, for the readiness probe.
    - fromEntities:
        - host
        - remote-node
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: senior-settlement-agent-ingress-allowlist
  namespace: northstar-agents
  labels:
    northstar.io/milestone: m3
spec:
  endpointSelector:
    matchLabels:
      app: senior-settlement-agent
  ingress:
    # 1. reviewer-ui -- and the ONLY application caller this document grants.
    # reviewer-ui (deploy/k8s/reviewer-ui.yaml) exists, and its
    # POST /review/{payment_id} handler is the one and only caller of
    # execute_approved over A2A in this repo, so it is the one and only rule
    # added here: granting reachability beyond a real, measured caller would
    # be exactly the "reachability nothing measured asked for" this file's own
    # egress header argues against.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-agents
            app: reviewer-ui
      toPorts:
        - ports:
            - port: "9002"
              protocol: TCP

    # 2. The node itself, for the readiness probe -- see the
    # policy-decision-service ingress document above for why this matters
    # even once rule 1 exists.
    - fromEntities:
        - host
        - remote-node
---
# =============================================================================
# reviewer-ui's own egress.
#
# THE MEASURED HAZARD, restated once more for this endpoint: in Cilium, ANY
# egress rule that selects an endpoint makes that endpoint default-deny for
# egress. This document's own header names two prior regressions this exact
# hazard produced (stripping the DNS proxy's `rules.dns` block, and widening
# egress to payments-mcp directly) that stayed green under behavioural probing
# alone. So this is reviewer-ui's *complete* outbound inventory, taken from
# `apps/reviewer-ui/bootstrap.py`, `ledger.py`, `approval.py` and
# `identity.py` rather than from watching a running pod:
#
#   * DNS (L3/L4 only -- no `rules.dns` block, because there is no `toFQDNs`
#     rule below for it to feed; same reasoning as claims-agent-egress-
#     allowlist's own rule 1).
#   * payments-api:8080 in northstar-systems (ledger.py's GET
#     /payments?status=refused and GET /payments/{id} -- a direct REST call,
#     never through agentgateway/payments-mcp/the Policy Decision Service:
#     reviewer-ui has no business anywhere near that governed MCP path, and
#     this is the enforced half of that boundary).
#   * senior-settlement-agent:9002 in northstar-agents (approval.py's A2A
#     POST carrying the human's approval -- the other half of the ingress
#     rule added above).
#   * the OTLP collector:4318 -- same "silent, not fatal" argument as every
#     other workload's own rule 3 in this file: dropping it would not break
#     the demo, it would just make `review.decision` (and every CLIENT span
#     this process emits) vanish from the trace no one would notice missing.
#
# Deliberately absent: agentgateway:3000, payments-mcp:8000,
# policy-decision-service:9100, and api.anthropic.com:443. reviewer-ui calls
# none of them -- it holds no `EXECUTE_LIMITS` row and must never be able to
# reach a place that would grant one. identity.py's SPIFFE Workload API call
# is a Unix domain socket, exactly like every other workload's own SVID fetch
# in this file's header note ("UDS IPC never enters the pod's network
# namespace, so Cilium policy does not govern it") -- there is nothing to
# allow here for it.
#
# Datapath assertion, not just this YAML: `cilium-dbg bpf policy get
# <reviewer-ui endpoint id>`, run against the live cluster.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reviewer-ui-egress-allowlist
  namespace: northstar-agents
  labels:
    northstar.io/milestone: m3
spec:
  endpointSelector:
    matchLabels:
      app: reviewer-ui
  egress:
    # 1. DNS -- L3/L4 only. See claims-agent-egress-allowlist's own rule 1
    # for why this workload gets no `rules.dns` block: there is no `toFQDNs`
    # rule here to feed one.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # 2. payments-api, directly -- ledger.py's GET /payments?status=refused
    # and GET /payments/{id}. Cross-namespace (northstar-systems), and still
    # namespace-pinned for the reason every other rule in this file gives.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-systems
            app: payments-api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # 3. senior-settlement-agent, on its A2A port -- approval.py's one
    # outbound peer, and the other half of this document's ingress rule for
    # that endpoint (above).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-agents
            app: senior-settlement-agent
      toPorts:
        - ports:
            - port: "9002"
              protocol: TCP

    # 4. The OTLP collector.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app: otel-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP

# Cilium network policy for stage 2.
#
# WHY THIS FILE EXISTS
#
# M2.1 put agentgateway in the MCP path and made it verify a SPIRE-issued
# JWT-SVID on every `tools/call`. That established the choke point *by
# convention*: `settlement-agent`'s PAYMENTS_MCP_URL names the gateway, so the
# agent's calls go through it. It did NOT establish the choke point *by
# enforcement* -- nothing stopped a workload from ignoring the gateway and
# talking to `payments-mcp` directly.
#
# That gap was measured, not assumed. With no policy applied, `claims-agent` --
# which holds no SVID and has no business touching payments -- POSTed an MCP
# `initialize` straight at
# `payments-mcp.northstar-tools.svc.cluster.local:8000/mcp` and got **HTTP
# 200**. The milestone's own claim, "the platform decides if it becomes an
# effect", was therefore true only for a cooperating caller.
#
# `tests/e2e/test_gateway_trace.py::test_the_gateway_is_the_only_route_into_payments_mcp`
# does not catch this, and its docstring is careful about why: it asserts that
# every `payments-mcp` span *in the observed trace* is parented to an
# agentgateway span. That is a statement about the traffic that happened, not
# about the traffic that is possible. Reachability needs the dataplane.
#
# This is also a gap in the M2 spec rather than merely in its implementation.
# The spec's Cilium section (§7) and its acceptance criterion 7 are both about
# **egress to the model provider** ("Direct egress from `northstar-agents` to
# the model provider is denied by Cilium"). Neither says anything about ingress
# to the tool. The architecture diagram's note "the gateway is the only path"
# is attached to the `api.anthropic.com` arrow, not to `payments-mcp`.
#
# Cilium was installed in M2.1 precisely so there would be a dataplane to put
# this on, and until now it carried no policy at all.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: payments-mcp-gateway-only
  namespace: northstar-tools
  labels:
    northstar.io/milestone: m2.2
spec:
  # Selects the tool being protected, not the callers. An endpointSelector with
  # an `ingress` block makes this endpoint default-deny for ingress: anything
  # not matched by a rule below is dropped. That is the point -- an allowlist
  # that has to be added to, rather than a denylist that has to anticipate.
  endpointSelector:
    matchLabels:
      app: payments-mcp
  ingress:
    # 1. The gateway, and nothing else in the mesh.
    #
    # Both labels are required and they do different jobs: `app: agentgateway`
    # picks the workload, and the namespace label scopes it, so a pod that
    # happens to label itself `app: agentgateway` in some other namespace does
    # not inherit the gateway's reachability. `k8s:io.kubernetes.pod.namespace`
    # is Cilium's own spelling for the namespace an endpoint lives in.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-platform
            app: agentgateway
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

    # 2. The node itself, for the readiness probe.
    #
    # deploy/k8s/payments-mcp.yaml uses a `tcpSocket` readinessProbe on 8000,
    # and kubelet dials that from the node, not from a pod. Cilium's
    # `allow-localhost: auto` default would very likely cover it, but relying
    # on a default here would mean a probe failure -- which presents as the pod
    # never becoming Ready and `rollout status` hanging -- depends on a setting
    # this repo does not pin. `remote-node` is included for the same reason on
    # a multi-node cluster; this one has a single node today, and the rule
    # costs nothing when there is no remote node to match.
    - fromEntities:
        - host
        - remote-node
---
# M2.2 Task 4: the same argument, applied to the Policy Decision Service.
#
# A policy service anything can call is a policy service anything can
# impersonate answers from. The PDS is not a tool and not an agent's
# dependency: exactly one client in this cluster has any business opening a
# connection to it, and that is agentgateway, on the guardrail hook. Everything
# else -- settlement-agent, claims-agent, customer-ui, payments-mcp -- is
# denied by the mere presence of the `ingress` block below.
#
# What a bypass would buy here is different from the payments-mcp case, and
# worth being precise about rather than asserting the same sentence twice.
# Reaching payments-mcp directly skips the decision and moves money. Reaching
# the PDS directly moves nothing -- but the ExtMCP contract is unauthenticated
# on the wire (`add_insecure_port`; no mTLS in M2.2) and the caller identity the
# policy decides on arrives as a *field in the request*,
# `metadata_context.caller`, which the gateway fills from an already-verified
# `jwt.sub`. So anything that can call this service can claim to be
# settlement-agent and be told, truthfully, what the policy would answer. That
# is an oracle, not an authorisation: a confidentiality problem rather than an
# integrity one. It is closed here, on the dataplane, rather than by adding
# mTLS that this service's pinned dependency closure does not carry (ruling
# R4).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policy-decision-service-gateway-only
  namespace: northstar-platform
  labels:
    northstar.io/milestone: m2.2
spec:
  # Selects the PDS, not its callers -- and specifically NOT an empty
  # selector, which would match every endpoint in `northstar-platform` and
  # apply default-deny to all of SPIRE (server, agent, CSI driver, OIDC
  # discovery provider) and to agentgateway itself. In this namespace that
  # mistake would not break one service, it would break the trust root.
  endpointSelector:
    matchLabels:
      app: policy-decision-service
  ingress:
    # 1. The gateway, and nothing else in the mesh.
    #
    # Both labels, for the reason spelled out on the payments-mcp rule above.
    # Note that here the caller happens to live in the *same* namespace as the
    # protected endpoint, which makes the namespace label look redundant. It is
    # not: a Cilium `fromEndpoints` selector is not implicitly scoped to the
    # policy's own namespace the way a core NetworkPolicy's `podSelector` is,
    # so without the namespace label this would read "any pod anywhere
    # labelled app: agentgateway".
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: northstar-platform
            app: agentgateway
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP

    # 2. The node itself, for the probes. RULING R6 -- and the one rule in this
    # file whose absence would be actively misleading rather than merely
    # broken.
    #
    # deploy/k8s/policy-decision-service.yaml probes 9100 with `tcpSocket`
    # (ruling R26), and kubelet dials that from the host, not from a pod.
    # Without this the probe is dropped, the pod never goes Ready -- and
    # because the gateway's guardrail is `failureMode: failClosed`, a PDS the
    # gateway cannot reach REFUSES EVERY PAYMENT. The demo would then show the
    # €6,200 refused, which is exactly the outcome M2.2 exists to produce, for
    # entirely the wrong reason, with the €5,800 control refused alongside it
    # and nothing in the output mentioning networking. `remote-node` is
    # included on the same single-node reasoning as the payments-mcp rule.
    - fromEntities:
        - host
        - remote-node

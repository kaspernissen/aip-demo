# Linkerd control plane (chart linkerd-edge/linkerd-control-plane 2026.10.1,
# app edge-26.10.1). The chart version is pinned in scripts/setup-kind.sh
# (LINKERD_CHART_VERSION) and by tests/unit/test_stage2_linkerd_config.py, so
# the two cannot drift.
#
# The identity material is NOT in this file: setup-kind.sh passes
# identityTrustAnchorsPEM, identity.issuer.tls.crtPEM and
# identity.issuer.tls.keyPEM with --set-file, from the openssl-made, git-ignored
# .demo/linkerd-certs/ (scripts/linkerd-certs.sh).
#
# Everything else is the chart default, deliberately: native sidecar is on
# (nativeSidecar: true), proxy-init needs only NET_ADMIN (cniEnabled: false, so
# no linkerd-cni), default inbound policy is all-unauthenticated (only ports
# with a Server are restricted).

# PROXY TRACING STAYS OFF (M12 spec section 1). Turning it on would add about
# 140 proxy spans per run to every trace, and this demo never samples or drops a
# span: the trace's shape must stay exactly as M11 measured it. The chart's
# default is already false; it is written out so that a future chart default
# cannot turn it on unnoticed, and tests/unit/test_stage2_linkerd_config.py
# asserts both flags.
proxy:
  tracing:
    enabled: false
# The control plane's own tracing, same reasoning.
controller:
  tracing:
    enabled: false

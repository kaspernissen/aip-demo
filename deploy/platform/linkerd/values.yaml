# Linkerd control plane (chart linkerd-edge/linkerd-control-plane 2026.10.1,
# app edge-26.10.1). The chart version is pinned in scripts/setup-kind.sh
# (LINKERD_CHART_VERSION) and by tests/unit/test_linkerd_config.py, so
# the two cannot drift.
#
# The identity material is NOT in this file: setup-kind.sh passes
# identityTrustAnchorsPEM, identity.issuer.tls.crtPEM and
# identity.issuer.tls.keyPEM with --set-file, from the openssl-made, git-ignored
# .demo/linkerd-certs/ (scripts/linkerd-certs.sh).
#
# Workload certificates last a week, not the chart's 24 hours. A proxy renews
# its certificate while it runs, but a laptop that sleeps past the expiry wakes
# with every certificate expired and the mesh refusing every connection. A week
# covers bringing the cluster up the day before a talk and closing the lid.
identity:
  issuer:
    issuanceLifetime: 168h0m0s

# No heartbeat. The chart's daily CronJob only reports a version check to
# versioncheck.linkerd.io. On a laptop that is offline or on flaky wifi it
# fails, and its Job leaves seven pods in Error in `kubectl get pods -A`, the
# first thing the demo shows. It does nothing for the mesh.
disableHeartBeat: true

# Everything else is the chart default, deliberately: native sidecar is on
# (nativeSidecar: true), proxy-init needs only NET_ADMIN (cniEnabled: false, so
# no linkerd-cni), default inbound policy is all-unauthenticated (only ports
# with a Server are restricted).

# PROXY TRACING IS ON. Every meshed proxy sends a span for each HTTP request
# that arrives with a sampled W3C `traceparent`, to the OpenTelemetry collector
# over OTLP gRPC (protocol "opentelemetry", the chart's default, written out).
#
# Sampling: the proxy has no sampler of its own. It records a request only when
# the incoming traceparent is sampled and never starts a trace, so it follows
# the apps, which sample everything. Requests without a traceparent (kubelet
# probes, the OTLP exports themselves) produce no proxy span.
#
# Shape: each proxy layer re-parents the request, so one meshed-to-meshed call
# gains four spans between the caller's client span and the callee's server
# span (caller proxy outbound server + client, callee proxy inbound server +
# client), each named by the request path. tests/harness/jaeger.py skips them
# when it walks parents, so the app-level shape the e2e suite asserts holds.
#
# The proxy dials the collector itself, over mTLS, and expects the collector's
# mesh identity below. So the collector pod is meshed
# (deploy/observability/collector.yaml) and runs as service account
# otel-collector, and every egress NetworkPolicy allows the collector on 4317.
#
# Resource attributes: service.name=linkerd-proxy (traceServiceName), the pod's
# labels (read from the downward API) and the chart's default labels below.
proxy:
  tracing:
    enabled: true
    protocol: opentelemetry
    traceServiceName: linkerd-proxy
    collector:
      endpoint: otel-collector.observability.svc.cluster.local:4317
      meshIdentity:
        serviceAccountName: otel-collector
        namespace: observability
# The control plane's own tracing stays off: its Go controllers export with the
# OpenCensus agent exporter (linkerd2 pkg/trace, ocagent), not OTLP, and the
# collector has no OpenCensus receiver.
controller:
  tracing:
    enabled: false

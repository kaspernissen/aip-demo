# A dedicated ServiceAccount so the gateway's SPIFFE ID names it. The ID
# SPIRE derives is
# `spiffe://northstar.local/ns/northstar-platform/sa/agentgateway`, and that
# exact string is the JWT-SVID audience settlement-agent mints for and the
# `audiences` entry this gateway's own config.yaml checks -- so it has to be a
# real registered identity, not a label.
#
# The gateway itself never fetches an SVID and carries no Workload API mount:
# it verifies tokens by fetching SPIRE's JWKS over HTTP. That asymmetry is
# deliberate and recorded in deploy/platform/spire/registration.yaml. Grants
# no RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentgateway
  namespace: northstar-platform
  labels:
    app: agentgateway
    northstar.io/plane: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: northstar-platform
  labels:
    app: agentgateway
    northstar.io/plane: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
        northstar.io/plane: platform
      annotations:
        # Meshed by Linkerd: a pod-level opt-in, because the platform
        # namespace is not.
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: agentgateway
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.6.0
          args: ["-f", "/etc/agentgateway/config.yaml"]
          ports:
            - name: mcp
              containerPort: 3000
            - name: readiness
              containerPort: 15021
          # Confirmed against the running image (not guessed): agentgateway
          # serves its own readiness endpoint on 15021, returning HTTP 200
          # with body "ready" once the config is loaded and the bind is up
          # -- more precise than a bare TCP-connect probe against the MCP
          # port itself.
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
            initialDelaySeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
          # Measured idle RSS for this image is 11.2 MiB. 64Mi request /
          # 128Mi limit is generous headroom, not copied from a larger
          # service's values.
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: agentgateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: northstar-platform
spec:
  selector:
    app: agentgateway
  ports:
    - name: mcp
      port: 3000
      targetPort: 3000

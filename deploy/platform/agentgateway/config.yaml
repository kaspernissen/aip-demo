# agentgateway v1.6.0 standalone config. Image:
# cr.agentgateway.dev/agentgateway:v1.6.0 (note the leading `v` -- the tag
# `1.6.0` with no `v` does not exist on cr.agentgateway.dev, as for 1.5.0.
# `agentgateway --version` reports the bare "1.6.0" as its internal version
# string, but the pullable image tag carries the `v` prefix).
#
# Upstream check, 2026-10-13: v1.6.0 (GA 2026-10-02, the newest non-prerelease
# per `gh api repos/agentgateway/agentgateway/releases`) bumped from v1.5.0
# (2026-08-27). The v1.6.0, -rc.1, -alpha.2 and -alpha.1 release notes were read
# for everything this file touches. This file's keys needed no change to parse:
# the v1.5.0 and v1.6.0 images both reach the JWKS fetch (the validator's
# last stage) on this exact file. One key was ADDED for a changed default:
# `frontendPolicies.tracing.parentNotSampled` (see below).
#
# The external `ExtMCP` gRPC hook is configured below, as `mcpGuardrails`,
# pointed at the Policy Decision Service and set to `failureMode: failClosed`.
# Native CEL `mcpAuthorization` is deliberately absent: the authorization
# decision belongs to the PDS, not to this file. The route-level `authorization`
# ceiling (M8) is the one exception, and it only ever says no.
#
# Schema verified directly against the pinned image: `docker run --rm
# cr.agentgateway.dev/agentgateway:v1.6.0 -f config.yaml --validate-only`
# returns "Configuration is valid!" for exactly the shape below. Source of
# truth for this schema is the agentgateway repo's examples/ directory, NOT
# its documentation site -- the docs are thin and unreliable; the examples
# match real behaviour exactly.
#
# The `frontendPolicies.tracing` block below is what keeps the gateway from
# being a silent hop: without it, MCP calls pass through with no span at
# all, and the trace shows settlement-agent talking directly to
# payments-mcp, with the proxy invisible.
#
# Schema source: the agentgateway repo's own `examples/mcp-telemetry/config.yaml`
# at tag v1.5.0 (which is exactly `frontendPolicies.tracing.{host,randomSampling}`),
# cross-read against the v1.5.0 `TracingConfig` struct in
# `crates/agentgateway/src/types/agent.rs:2454-2495`. `host` comes from the
# flattened `SimpleBackendReferenceWithPolicies`.
#
# `protocol: grpc` is stated explicitly rather than left to the default, for a
# specific reason: the field's own doc comment in that struct
# (`agent.rs:2492`) reads "OTLP protocol used to export traces. Defaults to
# HTTP", but the `TracingProtocol` enum 22 lines below it marks `Grpc` as
# `#[default]` (`agent.rs:2514-2521`) -- the comment and the code disagree.
# Rather than depend on which one wins, this says which one we want. gRPC on
# 4317 is the collector's own OTLP/gRPC receiver
# (`deploy/observability/collector-config.yaml`); note that this makes the
# gateway the one component in this system exporting over gRPC -- every
# Python/Go service here uses OTLP/HTTP on 4318.
#
# `randomSampling: true` matches the upstream example. It is not needed for
# this system's own path and is set for a caller we do not have yet: measured
# in v1.5.0's `TraceSampler::trace_sampled`
# (`crates/agentgateway/src/telemetry/log.rs:469-494`), a request that arrives
# *with* an incoming `traceparent` is sampled by default ("If client_sampling
# is not set, default to include it"), while a request arriving *without* one
# is dropped by default ("If random_sampling is not set, default to NOT include
# it"). settlement-agent always sends the header (HTTPXClientInstrumentor), so
# our spans would appear either way; this makes a headerless caller visible
# too, instead of silently untraced.
#
# `parentNotSampled: true` is new in v1.6.0 (upstream PR #3316, verified in
# v1.6.0's `TraceSampler::trace_sampled`, log.rs:554-579) and is the same
# standing requirement as `randomSampling`: 100% of telemetry, always. v1.6.0
# splits the incoming-`traceparent` case in two: a sampled parent (`-01`) still
# defaults to recorded (`clientSampling`, default true), but an UNSAMPLED parent
# (`-00`) now follows `parentNotSampled`, which defaults to false -- the
# OpenTelemetry ParentBased sampler's `remoteParentNotSampled` delegate. No
# caller here sends `-00` today (every SDK is always-on), so this changes
# nothing measured; it is set so that a caller that ever does is recorded
# rather than silently dropped by a default that moved under the pin.
frontendPolicies:
  tracing:
    host: otel-collector.observability.svc.cluster.local:4317
    protocol: grpc
    randomSampling: true
    parentNotSampled: true
binds:
- port: 3000
  listeners:
  - routes:
    # This `policies` block is the only policy configuration in this file.
    #
    # `jwtAuth` is JWT *verification*, not authorization: on its own it decides
    # whether the caller is authenticated, never whether it may do what it
    # asked. There is deliberately no `mcpAuthorization` here -- this block
    # makes identity real and checkable and leaves the authorization decision to
    # `mcpGuardrails` below. The one `authorization` rule, at the end of this
    # block, is a coarse ceiling, not a decision: see there.
    #
    # The absence of `mcpAuthorization` is deliberate; the absence of
    # authorization overall is not: the `mcpGuardrails` block in this same
    # `policies` map sends every `tools/call` to the Policy Decision Service at
    # the request phase and refuses the call when the PDS says deny (or cannot
    # answer -- `failureMode: failClosed`).
    #
    # Schema source: the pinned v1.5.0 image's own `examples/`, cross-read
    # against the Rust types, NOT the documentation site -- the docs are thin,
    # the examples exact. `jwtAuth` is a field of
    # `LocalGatewayPolicy`/`FilterOrPolicy` in
    # crates/agentgateway/src/types/local.rs, typed
    # `crate::http::jwt::LocalJwtConfig`; the single-issuer shape used here is
    # that enum's `Single` variant (crates/agentgateway/src/http/jwt.rs), whose
    # own Deserialize impl selects `Multi` if and only if a `providers` key is
    # present -- so `issuer`/`audiences`/`jwks` at this level is the
    # single-issuer form, unambiguously. `examples/mcp-authorization/config.yaml`
    # at v1.5.0 shows the same keys (there with `jwks.file`).
    #
    # Validated against the pinned image before deploying, from this directory:
    #   docker run --rm -v .:/w cr.agentgateway.dev/agentgateway:v1.6.0 \
    #     -f /w/config.yaml --validate-only
    #
    # Note the literal `.` rather than the shell's usual current-directory
    # variable in that command: agentgateway v1.5.0 expands environment
    # variables in this file's raw text BEFORE parsing it as YAML, comments
    # included, and an unset name is a hard error -- "Error: error looking key
    # 'PWD' up: environment variable not found", which is exactly what the
    # first draft of this comment produced (and then, once, again: the fix
    # mentioned a dollar-prefixed placeholder name and hit the same wall). That
    # is a live constraint on this whole file, not a quirk of one command line:
    # a dollar-sign reference anywhere in here, even inside a comment, must
    # resolve in the gateway container's environment or the gateway refuses to
    # start. Which is why this file contains no dollar signs at all, and why
    # tests/unit/test_stage2_spire_config.py asserts that.
    - policies:
        jwtAuth:
          # `strict` is a DELIBERATE override of the chart-free default, and it
          # is the one value here that changes behaviour rather than describing
          # it. The `Mode` enum in crates/agentgateway/src/http/jwt.rs marks
          # `Optional` as `#[default]`, documented as "Validate the JWT when
          # present. Warning: this allows requests without a JWT." Left at the
          # default, a caller that sent no credential at all would sail
          # through, and this task's whole claim -- that the platform knows who
          # is calling -- would hold only for callers that volunteered. `strict`
          # is "Require a valid JWT from a configured issuer."
          #
          # This is still not authorization: strict mode decides whether the
          # caller is *authenticated*, not whether it may do what it asked.
          mode: strict
          # Must equal the token's `iss` exactly. Both sides come from ONE
          # value, `global.spire.jwtIssuer` in deploy/platform/spire/values.yaml,
          # which the chart renders into spire-server's `jwt_issuer` (the claim
          # it mints) and into the discovery provider's `jwt_issuer` (the
          # `issuer` it advertises). Measured from a real minted token:
          #   iss = http://spire-spiffe-oidc-discovery-provider.northstar-platform.svc.cluster.local
          issuer: http://spire-spiffe-oidc-discovery-provider.northstar-platform.svc.cluster.local
          # A non-empty list makes a matching `aud` claim mandatory (that
          # struct's own doc comment). This is the gateway's own registered
          # SPIFFE ID, which is what settlement-agent asks SPIRE to mint for
          # (NORTHSTAR_GATEWAY_AUDIENCE in deploy/k8s/settlement-agent.yaml).
          # Scoping the audience to this one verifier is what stops a token
          # captured here from being replayed at any other SPIFFE service in
          # the trust domain.
          audiences:
          - spiffe://northstar.local/ns/northstar-platform/sa/agentgateway
          # SPIRE's JWT signing keys, published as a JWKS by the chart's
          # spiffe-oidc-discovery-provider. `{url: ...}` is the `Remote`
          # variant of `serdes::FileInlineOrRemote`; a `{file: ...}` here would
          # go stale the first time SPIRE rotates its JWT signing key, which it
          # does on its own schedule.
          #
          # `/keys` is not a guess: it is the `jwks_uri` the provider's own
          # discovery document advertises, fetched live from the running
          # service.
          #
          # Plain HTTP inside the cluster, recorded as a tradeoff in
          # docs/architecture.md rather than hidden: serving this over the
          # chart's default HTTPS would mean teaching agentgateway to trust the
          # SPIRE CA in order to fetch a public key set.
          jwks:
            url: http://spire-spiffe-oidc-discovery-provider.northstar-platform.svc.cluster.local/keys
        # `mcpGuardrails` is a route-level policy and a SIBLING of `jwtAuth`
        # above -- the two do different jobs on the same hop. `jwtAuth`
        # establishes *who* is calling; this establishes *what* that caller
        # may do. Losing either makes the other meaningless: an
        # unauthenticated caller with a policy is a policy deciding on a
        # self-asserted name, and an authenticated caller with no policy
        # permits every tool call it can authenticate.
        #
        # EVERY KEY AND ENUM VALUE HERE IS camelCase; this shape is confirmed
        # by iterating against the pinned image's own validator, not read off
        # documentation. Validate before deploying, from
        # deploy/platform/agentgateway:
        #   docker run --rm -v .:/c cr.agentgateway.dev/agentgateway:v1.6.0 \
        #     --validate-only -f /c/config.yaml
        # A rejected config names the offending key. Note that the validator
        # goes on to fetch the JWKS, so reaching that stage already proves the
        # schema parsed. (Same no-dollar-sign constraint as the rest of this
        # file: the gateway expands environment variables in the raw text,
        # comments included, before parsing.)
        mcpGuardrails:
          processors:
            # `kind: remote` is the external hook -- the ExtMCP gRPC service in
            # platform/policy-decision-service, serving
            # `agentgateway.dev.ext_mcp.ExtMcp`.
            - kind: remote
              # Only `tools/call` is sent for a decision, at the REQUEST phase:
              # before the call reaches payments-mcp, which is the only moment
              # at which a refusal is still a refusal rather than a regret.
              # `initialize` and `notifications/initialized` carry no tool and
              # no amount, so there is nothing to decide about them -- and
              # pds/server.py denies any method it is handed other than this
              # one, so a config change that widened this block would fail
              # loudly rather than silently permit.
              methods:
                "tools/call": request
              # The right arm of the flattened backend reference -- the same
              # spelling `frontendPolicies.tracing.host` already uses at the
              # top of this file. `name:`+`port:` and `backend:` are the other
              # two arms and exactly one may be set.
              host: policy-decision-service.northstar-platform.svc.cluster.local:9100
              # Stated explicitly. If the decision service cannot answer, the
              # answer is no. The cost is that a PDS outage stops payments,
              # which is the correct trade for a component whose entire job is
              # refusing them, and it is why the PDS's own readiness probe and
              # its ingress network policy (see
              # deploy/platform/cilium-policies.yaml) are load-bearing rather
              # than hygiene.
              #
              # `FailureMode`'s default matters here because omitting this key
              # would PERMIT EVERY PAYMENT during a PDS outage if the default
              # were `FailOpen` -- so it is measured rather than assumed.
              # Measured against this exact image, whose `--version` reports
              # git_revision fe6732474a96a0363dfb9822859af4e9bab360fa (= the
              # v1.5.0 tag), with a guardrail pointed at a dead address so
              # every tools/call takes the failure branch:
              #   key omitted        -> rejected, "mcpGuardrails checkRequest
              #                         failed: ... Connection refused"
              #   failureMode: failClosed -> the same error, byte for byte
              #   failureMode: failOpen   -> the call PASSED THROUGH to the tool
              # The default is failClosed. Source agrees:
              # crates/agentgateway/src/mcp/guardrails/mod.rs at that revision
              # puts `#[default]` on `FailClosed`, and client.rs imports its
              # FailureMode from that module.
              #
              # The line stays anyway, and so does the test that requires it.
              # The reason is now the honest one: `failOpen` is one word away,
              # and a fail-open gateway is indistinguishable from a governing
              # one until someone reads a trace. Naming the value makes the
              # intent reviewable rather than inherited.
              failureMode: failClosed
              # What the gateway hands the PDS about the caller. `jwt.sub` is a
              # CEL expression over the token `jwtAuth` above has ALREADY
              # verified -- signature, issuer, audience and expiry -- so what
              # arrives at the PDS is an attested subject, which for a JWT-SVID
              # is the caller's SPIFFE ID. It lands in
              # `McpRequest.metadata_context` under `caller` and is exactly
              # what pds/identity.py reads.
              #
              # Note what is deliberately NOT here: `jwtAuth.preserveToken:
              # true`. This delivers the verified subject without forwarding a
              # live bearer credential to a second service, which would be a
              # security regression for no gain at all -- pds/identity.py
              # accepts the `headers` half of the request and documents that
              # it does not read it.
              metadata:
                caller: 'jwt.sub'
              # `requestHeaders.allowed` IS A STRICT ALLOWLIST, and this is
              # the one line in this block that was measured wrong before it
              # was measured right. Recorded in full because the failure was
              # silent and the fix is counter-intuitive.
              #
              # `allowed: ["authorization"]` alone validates, the gateway
              # starts, the PDS is called, and the policy decides correctly.
              # What it does NOT do is forward `traceparent`, because the list
              # is exhaustive rather than additive. So
              # `pds/telemetry.context_from_headers` finds no trace context,
              # `extract` returns an empty context, and every
              # `northstar.policy.decision` span starts A NEW ROOT TRACE OF ITS OWN. In
              # Jaeger that reads as the policy working perfectly while the
              # observability claim -- that the decision appears in the same
              # trace as the gateway's `tools/call` and the model's reasoning
              # -- is quietly false: orphan single-span traces, `refs=[]`,
              # service present in Jaeger's service list, nothing wrong in any
              # log.
              #
              # Three values were measured against the running cluster, each
              # by driving one real `tools/call` (`propose_payment`, so no
              # model tokens were spent) with a minted JWT-SVID and a known
              # `traceparent`:
              #   allowed: ["authorization"]              -> orphan root span
              #   the whole `requestHeaders` block absent -> correctly parented
              #   allowed: ["traceparent", "tracestate"]  -> correctly parented
              #
              # The explicit pair is chosen over the block's absence: the
              # default's contents were not measured, and naming exactly what
              # the hook needs is the same argument the network policies in
              # this repo make. `tracestate` rides with `traceparent` in W3C
              # trace context and costs nothing; `baggage` is deliberately not
              # here, because nothing in the PDS reads it.
              #
              # `authorization` is deliberately NOT in this list. It would be
              # inert anyway -- without `preserveToken`, `jwtAuth`
              # removes the credential from its location on the way out
              # (`if !self.preserve_token { self.location.remove(req)?; }`,
              # crates/agentgateway/src/http/jwt.rs) -- but an allowlist is
              # exactly where a future `preserveToken` would turn an inert
              # entry into a forwarded bearer token, and pds/identity.py reads
              # the caller from `metadata_context` and documents that it never
              # reads a header.
              requestHeaders:
                allowed: ["traceparent", "tracestate"]
        # A hard ceiling, enforced by the gateway itself, before the PDS is
        # asked: no caller may execute a payment above EUR 50,000, or of a
        # non-positive amount. Written as an ALLOW rule on purpose: a `deny:`
        # rule fails OPEN on a value it cannot evaluate (a string "60000"
        # executed in the spike), while an allow rule that errors denies.
        # v1.6.0+ only: on v1.5.0 this policy has no MCP context and denies
        # every request. Measured: .demo/reports/cel-spike-report.md section 2.2
        # and section 4. A denial is `403 text/plain "authorization failed"` and
        # leaves no northstar.policy.decision span: the PDS is never asked.
        authorization:
          rules:
          - allow: 'request.method != "POST" || mcp.methodName != "tools/call" || mcp.tool.name != "execute_payment" || (mcp.tool.arguments.amount > 0 && mcp.tool.arguments.amount <= 50000)'
      backends:
      - mcp:
          targets:
          - name: payments-mcp
            mcp:
              host: payments-mcp.northstar-tools.svc.cluster.local
              port: 8000
              path: /mcp

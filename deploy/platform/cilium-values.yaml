# Cilium values for stage 2. Chart version pinned to 1.20.1 (resolved from
# `helm search repo cilium/cilium --versions`; appVersion 1.20.1).
#
# kube-proxy replacement is deliberately OFF: the demo needs DNS-aware egress
# denial (toFQDNs), which is ordinary CiliumNetworkPolicy and works with
# kube-proxy in place. This equals the chart default ("false" as a string;
# the schema accepts a boolean too) and is stated explicitly to record the
# decision.
kubeProxyReplacement: false

# Deliberate deviation from the chart default of "cluster-pool": in `kubernetes`
# mode Cilium allocates from the node podCIDRs kind assigns out of its default
# 10.244.0.0/16, so pod addressing matches what kind reports.
ipam:
  mode: kubernetes

# The toFQDNs egress policy needs NO values change here: it depends on the
# DNS proxy, which is gated by `l7Proxy` -- default true. The `dnsProxy` block
# in this chart carries tuning knobs only and has no `enabled` key.

hubble:
  enabled: false   # flow visibility is not this milestone's story; keep memory down
operator:
  replicas: 1      # single-node kind cluster

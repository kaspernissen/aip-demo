receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:8080"
          allowed_headers:
            - "*"

  # M2.1 Task 4: SPIRE's own telemetry.
  #
  # SPIRE 1.15.3 has no OpenTelemetry support at all -- no OTLP exporter and no
  # tracing (its telemetry block offers Prometheus, DogStatsD, Statsd, M3 and
  # an in-memory sink and nothing else; see deploy/platform/spire/values.yaml).
  # Prometheus metrics are therefore the only real telemetry it emits, and
  # without this receiver they would be exposed on :9988 and thrown away --
  # exactly the "component with no telemetry configured is invisible" hole
  # M2.1 Task 3 found in agentgateway.
  #
  # Two jobs rather than one with two targets, so the receiver stamps a
  # distinguishable `service.name` (it derives it from job_name) on each side
  # instead of merging the server's and the agent's series under one identity.
  #
  # Scrape targets are the Services in deploy/platform/spire/metrics.yaml; the
  # chart publishes no Service for either metrics port itself. That file records
  # the single-node assumption these static_configs rest on.
  prometheus/spire:
    config:
      scrape_configs:
        - job_name: spire-server
          scrape_interval: 30s
          static_configs:
            - targets: ["spire-server-metrics.northstar-platform.svc.cluster.local:9988"]
        - job_name: spire-agent
          scrape_interval: 30s
          static_configs:
            - targets: ["spire-agent-metrics.northstar-platform.svc.cluster.local:9988"]

processors:
  batch:
    timeout: 1s
  resource_detection:
    detectors: [env]
    override: false

  # BEGIN stage-4-only
  # M4 Task 1, fix round 1 (review finding F1): the spec's own prior art, an
  # OpenSearch-only branch that carries "the same enriched spans, minus the
  # keys OpenSearch cannot map" (spec §3 quotes the reference's
  # `resource/opensearch-compat` processor saying exactly that).
  #
  # WHAT BREAKS WITHOUT IT, measured on this cluster 2026-09-13:
  # the `policy.decision` span sets BOTH `policy.decision` (a string) and
  # `policy.decision.retryable` (a bool) -- ATTR_DECISION and ATTR_RETRYABLE in
  # platform/policy-decision-service/pds/telemetry.py -- cited by NAME rather
  # than by line, the one form that survives an edit to the file above them.
  # The line numbers here were 32,40 and were wrong by M4's final review:
  # those are SPAN_NAME and ATTR_CURRENCY, in the comment explaining the
  # milestone's central mechanism. OpenSearch expands dotted keys into
  # objects at index time, so one document would need
  # `attributes.policy.decision` to be a scalar and an object at once. It
  # refuses the bulk item permanently, per document, forever:
  #   kubectl -n observability logs deploy/otel-collector --since=48h \
  #     | grep "Exporting failed"
  #   -> 4 events, 13 rejected span items, all of them:
  #      "can't merge a non object mapping [attributes.policy.decision] with an
  #       object mapping"
  # Result before this processor existed, and STILL true of the traces driven
  # before it, because a rejection here is permanent rather than retried:
  # trace e25671d61d40b117763d4ceb46637dcd holds 142 spans in Jaeger and 139
  # documents in OpenSearch, re-counted 2026-09-13 after the fix was live. The
  # three missing ones are exactly its three `policy.decision` spans. Every
  # `policy-decision-service` document now in the index (14 at the time of
  # writing) belongs to a trace driven after this processor existed; none
  # predates it.
  #
  # WHY A RENAME AND NOT AN INDEX TEMPLATE. Mechanism (1) of ruling M4-R4 was
  # tried first and measured insufficient; the transcript is in
  # .superpowers/sdd/2026-09-11-m4-observable/task-1-fix-round-1-report.md.
  # Short version, all against OpenSearch 3.8.0 on this cluster: `subobjects:
  # false` is rejected outright ("unsupported parameters: [subobjects : false]");
  # `index.mapping.ignore_malformed` does not apply to an object-vs-scalar path
  # collision and the document is still rejected; only `"type": "flat_object"`
  # on the whole `attributes` subtree indexes the document, and it costs more
  # than it buys -- `_field_caps` then reports `attributes` as one
  # non-aggregatable field with NO subfields (so Task 3's Dashboards index
  # pattern would not list `attributes.policy.decision` at all), a terms
  # aggregation returns `java.lang.Object@...` buckets, and ranges become
  # lexical ("42" > "100" matches).
  #
  # WHY ONLY HERE (ruling M4-R5). This processor runs in the `traces/opensearch`
  # pipeline only. Jaeger and Dash0 are exported from the main `traces`
  # pipeline, upstream of the `forward/opensearch` tee, so they keep the
  # canonical `policy.decision.retryable` the telemetry contract defines. An
  # evidence view whose field names differ from the trace an operator reads in
  # Jaeger is worse than none -- so exactly one key is rewritten, the collider,
  # and never the `policy.decision` key the whole milestone is about.
  # tests/e2e/test_opensearch_trace_ingest.py asserts both halves of that
  # against the live cluster.
  #
  # ONE key, because one is all that collides. Measured 2026-09-13 by
  # enumerating every attribute key Jaeger held across all ten of its services
  # (/api/traces per service): 114 distinct span attribute keys, of which
  # `policy.decision` -> `policy.decision.retryable` is the only pair where
  # one key is a dotted prefix of another. No resource attribute and no
  # span-event attribute collides at all.
  #
  # WHAT PINS THAT, stated precisely -- because the mapping is index-wide, so
  # the two colliding keys need not be on the same span or even come from the
  # same service, and an earlier version of this comment claimed a coverage it
  # did not have (re-review finding N2: it said a unit test pinned the
  # ten-service claim, while that test read only pds/telemetry.py):
  #   * tests/unit/test_stage4_config.py now scans EVERY first-party service's
  #     source -- agents/, apps/, platform/, systems/, tools/ -- for
  #     attribute-shaped string literals, and fails if any collision among
  #     them is not renamed here. It cannot see keys emitted by third-party
  #     libraries.
  #   * tests/e2e/test_opensearch_trace_ingest.py::
  #     test_no_attribute_key_in_the_driven_trace_collides_uncovered applies
  #     the same rule to every key Jaeger actually holds for a driven trace,
  #     third-party keys included, for the services that trace reaches.
  #   * ...and that file's log assertion reddens on a rejection from ANY
  #     component that exported during the run, which is the backstop.
  # The residual gap, named rather than papered over: a library upgrade that
  # introduces a collider on a service the driven trace does not reach
  # (settlement-agent's model spans, reviewer-ui, customer-ui) would be caught
  # by the log assertion on the gate run, not before it.
  #
  # `insert` rather than `upsert` so a future real `policy.decision_retryable`
  # attribute would win over this copy rather than be silently overwritten.
  attributes/opensearch-compat:
    actions:
      - key: policy.decision_retryable
        from_attribute: policy.decision.retryable
        action: insert
      - key: policy.decision.retryable
        action: delete
  # END stage-4-only

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger.observability.svc.cluster.local:4317
    tls:
      insecure: true
  debug:
    verbosity: normal

  # BEGIN stage-4-only
  # M4 Task 1: the trace-ingest path, MEASURED rather than assumed (spec §3).
  # The user's own otel-platform-demo (infrastructure/collector/
  # deployment-values.yaml) proves the `opensearch` exporter for LOGS only --
  # its traces pipeline goes to otlp/dash0 and otlp/jaeger, never to
  # OpenSearch. Reuse was tried against traces first anyway (the user's own
  # instruction), and no Data Prepper was needed: the opensearchexporter for
  # THIS pinned collector image (otel/opentelemetry-collector-contrib:0.160.0,
  # see .env) supports Traces in its default `ss4o` mapping mode -- the prior
  # art's repo just never exercised the traces half.
  #
  # What the exporter alone did NOT survive is the attribute collision the
  # `attributes/opensearch-compat` processor above fixes; read that comment
  # before changing anything here. What is measured now, on this cluster
  # (2026-09-13, transcript in
  # .superpowers/sdd/2026-09-11-m4-observable/task-1-fix-round-1-report.md):
  # for one driven trace, Jaeger and OpenSearch hold the SAME span-id set --
  # equal counts and an empty symmetric difference, the `policy.decision`
  # spans included -- and the collector logs zero `Exporting failed` events
  # over the whole window (`logs --since=...`, not a `--tail` of it: reading a
  # 200-line tail of a 17,173-line log is exactly how the earlier version of
  # this comment came to claim "no errors").
  #
  # `http://`, not the reference's `https://` + basicauth: this cluster's
  # OpenSearch (deploy/observability/opensearch/values.yaml) runs with
  # DISABLE_SECURITY_PLUGIN=true, so there is no TLS listener and no auth to
  # satisfy -- a plain HTTP endpoint is the correct one for THIS cluster, not
  # a simplification of the reference's shape.
  opensearch/trace:
    http:
      endpoint: http://opensearch-cluster-master.observability.svc.cluster.local:9200
  # END stage-4-only

  # BEGIN stage-4-only
  # M4 Task 2: Prometheus, fed by the collector rather than scraping anything.
  # M4 exit criterion 5 is "Prometheus receives metrics over OTLP with no
  # application change to the routing and no scrape configuration", and this
  # exporter is that whole routing change -- the services below it set no
  # `OTEL_METRICS_*` variable and know nothing about Prometheus; they export
  # OTLP to this collector exactly as they already did for traces.
  #
  # The endpoint's shape is copied from the user's own otel-platform-demo,
  # which reaches Prometheus at `/api/v1/otlp`. It is a BASE path: the
  # otlp_http exporter appends the signal's own suffix, so what is actually
  # POSTed is `/api/v1/otlp/v1/metrics`, which is the path Prometheus v3.14.0
  # serves once `--web.enable-otlp-receiver` is passed (see
  # deploy/observability/prometheus/values.yaml, which reads that flag's
  # spelling out of v3.14.0's own cmd/prometheus/main.go:475 rather than from
  # memory).
  #
  # `9090`, and the Service really is called `prometheus`: both are overrides
  # in that values file, not chart defaults -- the chart would publish
  # `prometheus-server` on port 80. If this endpoint ever stops resolving,
  # check `server.fullnameOverride` and `server.service.servicePort` there
  # first.
  #
  # `tls.insecure: true` is carried over verbatim from the reference config
  # and is INERT for this endpoint: the scheme in `endpoint` decides, and
  # `http://` never negotiates TLS for the setting to relax. It is kept rather
  # than trimmed so this block matches the prior art it came from, and named as
  # inert here so nobody later reads it as evidence that a TLS listener exists.
  # `otlp_http/`, not the reference config's `otlphttp/`. The pinned collector
  # image (otel/opentelemetry-collector-contrib:0.160.0, see .env) accepts both
  # and says so on startup, verbatim from
  # `kubectl -n observability logs deploy/otel-collector`:
  #
  #   warn  builders/builders.go:40  "otlphttp" alias is deprecated; use
  #   "otlp_http" instead  {... "otelcol.component.id": "otlp_http/prometheus",
  #   "otelcol.component.kind": "exporter", "otelcol.signal": "metrics"}
  #
  # The deprecated spelling was what shipped first here and produced exactly
  # that line. It is renamed rather than left to warn, which also puts it in
  # step with the two exporters above it -- this file has said `otlp_grpc/` and
  # not `otlpgrpc/` since M1.
  otlp_http/prometheus:
    endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/otlp
    tls:
      insecure: true
  # END stage-4-only

# BEGIN stage-4-only
# The `forward/` connector tee the spec names as worth stealing from the prior
# art (§3): the OpenSearch branch reuses the main traces pipeline's receivers
# and processors instead of re-declaring them, so it cannot silently drift
# from what Jaeger and Dash0 see. It is also what makes ruling M4-R5
# enforceable -- everything before the tee is shared and canonical, and the
# single rewrite lives after it.
connectors:
  forward/opensearch: {}
# END stage-4-only

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource_detection, batch]
      # One exporter per line so scripts/setup-kind.sh can strip the
      # stage-4-only entry below stage 4 with the same marker rule it uses for
      # every other block here.
      exporters:
        - otlp_grpc/jaeger
        # BEGIN stage-4-only
        - forward/opensearch
        # END stage-4-only
        - debug
    # BEGIN stage-4-only
    traces/opensearch:
      receivers: [forward/opensearch]
      processors: [attributes/opensearch-compat]
      exporters: [opensearch/trace]
    # END stage-4-only
    metrics:
      receivers: [otlp, prometheus/spire]
      processors: [batch]
      # One exporter per line, for the same reason the traces pipeline above is
      # written that way: scripts/setup-kind.sh strips the stage-4-only entry
      # below stage 4 with a line-range sed, and it cannot edit inside a flow
      # sequence. Below stage 4 this list is `- debug` alone -- which is
      # exactly what it was before M4 Task 2 (ruling M4-R8: the collector must
      # not name a backend the cluster does not have).
      exporters:
        # BEGIN stage-4-only
        - otlp_http/prometheus
        # END stage-4-only
        - debug
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

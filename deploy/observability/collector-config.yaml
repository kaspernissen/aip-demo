receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:8080"
          allowed_headers:
            - "*"

  # SPIRE's own telemetry.
  #
  # SPIRE 1.15.3 has no OpenTelemetry support at all -- no OTLP exporter and no
  # tracing (its telemetry block offers Prometheus, DogStatsD, Statsd, M3 and
  # an in-memory sink and nothing else; see deploy/platform/spire/values.yaml).
  # Prometheus metrics are therefore the only real telemetry it emits, and
  # without this receiver they would be exposed on :9988 and thrown away: a
  # component with no telemetry configured is invisible.
  #
  # Two jobs rather than one with two targets, so the receiver stamps a
  # distinguishable `service.name` (it derives it from job_name) on each side
  # instead of merging the server's and the agent's series under one identity.
  #
  # Scrape targets are the Services in deploy/platform/spire/metrics.yaml; the
  # chart publishes no Service for either metrics port itself. That file records
  # the single-node assumption these static_configs rest on.
  prometheus/spire:
    config:
      scrape_configs:
        - job_name: spire-server
          scrape_interval: 30s
          static_configs:
            - targets: ["spire-server-metrics.northstar-platform.svc.cluster.local:9988"]
        - job_name: spire-agent
          scrape_interval: 30s
          static_configs:
            - targets: ["spire-agent-metrics.northstar-platform.svc.cluster.local:9988"]

processors:
  batch:
    timeout: 1s
  resource_detection:
    detectors: [env]
    override: false

  # BEGIN stage-4-only
  # WHAT BREAKS WITHOUT IT: the `policy.decision` span sets BOTH
  # `policy.decision` (a string) and `policy.decision.retryable` (a bool) --
  # ATTR_DECISION and ATTR_RETRYABLE in
  # platform/policy-decision-service/pds/telemetry.py -- cited by NAME rather
  # than by line, the one form that survives an edit to the file above them.
  # OpenSearch expands dotted keys into objects at index time, so one document
  # would need `attributes.policy.decision` to be a scalar and an object at
  # once. It refuses the bulk item permanently, per document, forever:
  #   kubectl -n observability logs deploy/otel-collector --since=48h \
  #     | grep "Exporting failed"
  #   -> "can't merge a non object mapping [attributes.policy.decision] with an
  #       object mapping"
  # A rejection here is permanent rather than retried, so a trace driven
  # without this processor in the path keeps missing exactly its
  # `policy.decision` spans in OpenSearch.
  #
  # WHY A RENAME AND NOT AN INDEX TEMPLATE. Against OpenSearch 3.8.0 on this
  # cluster: `subobjects: false` is rejected outright ("unsupported
  # parameters: [subobjects : false]"); `index.mapping.ignore_malformed` does
  # not apply to an object-vs-scalar path collision and the document is still
  # rejected; only `"type": "flat_object"` on the whole `attributes` subtree
  # indexes the document, and it costs more than it buys -- `_field_caps` then
  # reports `attributes` as one non-aggregatable field with NO subfields (so
  # the Dashboards index pattern would not list `attributes.policy.decision`
  # at all), a terms aggregation returns `java.lang.Object@...` buckets, and
  # ranges become lexical ("42" > "100" matches).
  #
  # WHY ONLY HERE. This processor runs in the `traces/opensearch` pipeline
  # only. Jaeger and Dash0 are exported from the main `traces` pipeline,
  # upstream of the `forward/opensearch` tee, so they keep the canonical
  # `policy.decision.retryable` the telemetry contract defines. An evidence
  # view whose field names differ from the trace an operator reads in Jaeger
  # is worse than none -- so exactly one key is rewritten, the collider, and
  # never the `policy.decision` key itself.
  # tests/e2e/test_opensearch_trace_ingest.py asserts both halves of that
  # against the live cluster.
  #
  # ONE key, because one is all that collides: enumerating every attribute
  # key Jaeger holds across all ten services (/api/traces per service) turns
  # up 114 distinct span attribute keys, of which `policy.decision` ->
  # `policy.decision.retryable` is the only pair where one key is a dotted
  # prefix of another. No resource attribute and no span-event attribute
  # collides at all.
  #
  # WHAT PINS THAT, stated precisely -- the mapping is index-wide, so the two
  # colliding keys need not be on the same span or even come from the same
  # service:
  #   * tests/unit/test_stage4_config.py scans EVERY first-party service's
  #     source -- agents/, apps/, platform/, systems/, tools/ -- for
  #     attribute-shaped string literals, and fails if any collision among
  #     them is not renamed here. It cannot see keys emitted by third-party
  #     libraries.
  #   * tests/e2e/test_opensearch_trace_ingest.py::
  #     test_no_attribute_key_in_the_driven_trace_collides_uncovered applies
  #     the same rule to every key Jaeger actually holds for a driven trace,
  #     third-party keys included, for the services that trace reaches.
  #   * ...and that file's log assertion reddens on a rejection from ANY
  #     component that exported during the run, which is the backstop.
  # The residual gap, named rather than papered over: a library upgrade that
  # introduces a collider on a service the driven trace does not reach
  # (settlement-agent's model spans, reviewer-ui, customer-ui) would be caught
  # by the log assertion on the gate run, not before it.
  #
  # `insert` rather than `upsert` so a future real `policy.decision_retryable`
  # attribute would win over this copy rather than be silently overwritten.
  attributes/opensearch-compat:
    actions:
      - key: policy.decision_retryable
        from_attribute: policy.decision.retryable
        action: insert
      - key: policy.decision.retryable
        action: delete
  # END stage-4-only

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger.observability.svc.cluster.local:4317
    tls:
      insecure: true
  debug:
    verbosity: normal

  # BEGIN stage-4-only
  # The trace-ingest path. The opensearchexporter for this pinned collector
  # image (otel/opentelemetry-collector-contrib:0.160.0, see .env) supports
  # Traces in its default `ss4o` mapping mode, so no Data Prepper is needed.
  #
  # The exporter alone does not survive the attribute collision the
  # `attributes/opensearch-compat` processor above fixes; read that comment
  # before changing anything here. Verified on this cluster: for one driven
  # trace, Jaeger and OpenSearch hold the SAME span-id set -- equal counts and
  # an empty symmetric difference, the `policy.decision` spans included --
  # and the collector logs zero `Exporting failed` events over its full log
  # window (a short tail of a long-running log can miss those events).
  #
  # `http://`, not `https://` + basicauth: this cluster's OpenSearch
  # (deploy/observability/opensearch/values.yaml) runs with
  # DISABLE_SECURITY_PLUGIN=true, so there is no TLS listener and no auth to
  # satisfy -- a plain HTTP endpoint is the correct one for this cluster.
  opensearch/trace:
    http:
      endpoint: http://opensearch-cluster-master.observability.svc.cluster.local:9200
  # END stage-4-only

  # BEGIN stage-4-only
  # The logs pipeline's real exporter, alongside `debug`.
  #
  # This marker is named `stage-4-only`, not `stage-5-only`: OpenSearch is
  # the backend it names, and OpenSearch is installed starting stage 4
  # (`setup-kind.sh` Step 8c), exactly like the traces branch above -- the
  # marker tracks backend existence, not which task added the region.
  # Reusing the existing marker and the existing
  # `STAGE4_ONLY_STRIP`/`-lt 4` machinery in `scripts/setup-kind.sh` means a
  # `--stage 1|2|3` cluster still gets no reference to a backend it does not
  # have, with no change to that script at all --
  # `tests/unit/test_stage4_config.py::test_below_stage_4_the_collector_config_
  # names_no_opensearch` extends to this region automatically because it
  # strips by marker, not by exporter name.
  #
  # No `attributes/opensearch-compat`-style rename needed here: that
  # processor exists solely because `policy.decision`/`policy.decision.
  # retryable` collide as a scalar-vs-object OpenSearch mapping (one key a
  # dotted prefix of the other) on the SAME span. The `feature_flag.*`
  # attributes `pds/autonomy.py`'s `emit_evaluation_event` writes have no such
  # pair -- checked: none of `feature_flag.key`, `.provider.name`,
  # `.result.variant`, `.result.reason`, `.result.value`, `.context.id`,
  # `.set.id`, `.version`, `error.type` is a dotted prefix of another in that
  # set -- so this exporter is wired directly into the `logs` pipeline below,
  # no `forward`/tee connector and no branch pipeline needed the way traces
  # required one.
  opensearch/logs:
    http:
      endpoint: http://opensearch-cluster-master.observability.svc.cluster.local:9200
  # END stage-4-only

  # BEGIN stage-4-only
  # Prometheus, fed by the collector rather than scraping anything: the
  # services below set no `OTEL_METRICS_*` variable and know nothing about
  # Prometheus, they export OTLP to this collector exactly as they already do
  # for traces, and this exporter is the whole routing change that gets those
  # metrics to Prometheus with no application change and no scrape
  # configuration.
  #
  # The endpoint path is a BASE path: the otlp_http exporter appends the
  # signal's own suffix, so what is actually
  # POSTed is `/api/v1/otlp/v1/metrics`, which is the path Prometheus v3.14.0
  # serves once `--web.enable-otlp-receiver` is passed (see
  # deploy/observability/prometheus/values.yaml, which reads that flag's
  # spelling out of v3.14.0's own cmd/prometheus/main.go:475 rather than from
  # memory).
  #
  # `9090`, and the Service really is called `prometheus`: both are overrides
  # in that values file, not chart defaults -- the chart would publish
  # `prometheus-server` on port 80. If this endpoint ever stops resolving,
  # check `server.fullnameOverride` and `server.service.servicePort` there
  # first.
  #
  # `tls.insecure: true` is INERT for this endpoint: the scheme in `endpoint`
  # decides, and `http://` never negotiates TLS for the setting to relax. It
  # is named here as inert so nobody later reads it as evidence that a TLS
  # listener exists.
  #
  # `otlp_http/`, not `otlphttp/`: the pinned collector image
  # (otel/opentelemetry-collector-contrib:0.160.0, see .env) accepts both and
  # says so on startup, verbatim from
  # `kubectl -n observability logs deploy/otel-collector`:
  #
  #   warn  builders/builders.go:40  "otlphttp" alias is deprecated; use
  #   "otlp_http" instead  {... "otelcol.component.id": "otlp_http/prometheus",
  #   "otelcol.component.kind": "exporter", "otelcol.signal": "metrics"}
  #
  # `otlp_http/` is used consistently, matching the two exporters above it --
  # this file spells the grpc one `otlp_grpc/`, not `otlpgrpc/`.
  otlp_http/prometheus:
    endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/otlp
    tls:
      insecure: true
  # END stage-4-only

# BEGIN stage-4-only
# The `forward/` connector tee: the OpenSearch branch reuses the main traces
# pipeline's receivers and processors instead of re-declaring them, so it
# cannot silently drift from what Jaeger and Dash0 see. Everything before the
# tee is shared and canonical, and the single attribute rewrite lives after it.
connectors:
  forward/opensearch: {}
# END stage-4-only

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource_detection, batch]
      # One exporter per line so scripts/setup-kind.sh can strip the
      # stage-4-only entry below stage 4 with the same marker rule it uses for
      # every other block here.
      exporters:
        - otlp_grpc/jaeger
        # BEGIN stage-4-only
        - forward/opensearch
        # END stage-4-only
        - debug
    # BEGIN stage-4-only
    traces/opensearch:
      receivers: [forward/opensearch]
      processors: [attributes/opensearch-compat]
      exporters: [opensearch/trace]
    # END stage-4-only
    metrics:
      receivers: [otlp, prometheus/spire]
      processors: [batch]
      # One exporter per line, for the same reason the traces pipeline above is
      # written that way: scripts/setup-kind.sh strips the stage-4-only entry
      # below stage 4 with a line-range sed, and it cannot edit inside a flow
      # sequence. Below stage 4 this list is `- debug` alone: the collector
      # must not name a backend the cluster does not have.
      exporters:
        # BEGIN stage-4-only
        - otlp_http/prometheus
        # END stage-4-only
        - debug
    logs:
      receivers: [otlp]
      processors: [batch]
      # One exporter per line, same reason as the traces/metrics pipelines
      # above: scripts/setup-kind.sh strips the stage-4-only entry below
      # stage 4 with a line-range sed and cannot edit inside a flow sequence.
      # Below stage 4 this list is `- debug` alone: the collector must not
      # name a backend the cluster does not have.
      exporters:
        # BEGIN stage-4-only
        - opensearch/logs
        # END stage-4-only
        - debug

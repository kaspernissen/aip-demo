apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args: ["--config=/conf/collector-config.yaml"]
          env:
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-authorization-token
                  optional: true
            - name: DASH0_DATASET
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-dataset
                  optional: true
            - name: DASH0_GRPC_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-grpc-hostname
                  optional: true
            - name: DASH0_GRPC_PORT
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-grpc-port
                  optional: true
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-external
  namespace: observability
spec:
  type: NodePort
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30318

# The collector is the one meshed pod in `observability`. Linkerd's proxies
# send their own spans here over mTLS and check the collector's mesh identity,
# otel-collector.observability (deploy/platform/linkerd/values.yaml), so the pod
# needs a proxy and its own service account. Unmeshed senders (Kyverno, the
# browser through the NodePort, anything outside the mesh) still reach 4317 and
# 4318 in plaintext: the default inbound policy is all-unauthenticated and no
# Server selects this pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          # setup-kind.sh adds "--config=/conf/collector-dash0-overlay.yaml" here
          # when DASH0_AUTH_TOKEN is set; the collector merges the two files.
          args: ["--config=/conf/collector-config.yaml"]
          env:
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-authorization-token
                  optional: true
            - name: DASH0_DATASET
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-dataset
                  optional: true
            - name: DASH0_GRPC_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-grpc-hostname
                  optional: true
            - name: DASH0_GRPC_PORT
              valueFrom:
                secretKeyRef:
                  name: dash0-secrets
                  key: dash0-grpc-port
                  optional: true
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-external
  namespace: observability
spec:
  type: NodePort
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30318

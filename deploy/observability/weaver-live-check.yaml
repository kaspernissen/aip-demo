# Weaver live-check: checks the telemetry the platform really emits
# against telemetry/registry. The collector sends it a COPY of every span,
# metric and log (exporter `otlp_grpc/weaver`); nothing is
# sampled and nothing is dropped.
#
# Two ConfigMaps, both built by scripts/setup-kind.sh from the repo:
#   weaver-registry           <- telemetry/registry
#   weaver-live-check-config  <- telemetry/live-check.toml
#
# The semconv v1.44.0 dependency (telemetry/registry/manifest.yaml) is fetched
# from GitHub when the pod starts, so the pod needs egress to github.com. No
# NetworkPolicy selects this pod, so its egress is unrestricted; if one is ever
# added, github.com:443 must be allowed or the pod never gets Ready.
#
# Admin port 4320 (not the OTLP port): GET /health, POST /stop, GET /report
# (409 while still receiving), POST /shutdown. The gate restarts the pod
# (kubectl rollout restart) to start from an empty report.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaver-live-check
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weaver-live-check
  template:
    metadata:
      labels:
        app: weaver-live-check
    spec:
      # Weaver runs as PID 1 and ignores SIGTERM, so a replaced pod lingers for
      # the default 30s grace period, still accepting the collector's connection
      # (and, once stopped, answering "the OTLP receiver has stopped"). It holds
      # no state worth a grace period: the gate wants it gone.
      terminationGracePeriodSeconds: 1
      containers:
        - name: weaver
          image: otel/weaver:v0.28.0
          args:
            - registry
            - live-check
            - -r
            - /registry
            - --config
            - /config/live-check.toml
            - --input-source
            - otlp
            - --output
            - http
            - --format
            - json
          env:
            # Weaver caches the semconv checkout under $HOME.
            - name: HOME
              value: /tmp
          # Sized from measurement (crictl stats / cgroup memory.current).
          # Per sample: 13 MiB idle, 62 MiB after one live run of 2714 spans,
          # 3795 metrics and 40 logs, about 7.5 KiB per span or metric held.
          # Idle growth is about 3.8 MB/min (220 MiB/hour) from background
          # traffic alone (about 490 metric points and 60 spans a minute). A
          # 768Mi limit would be reached in about 3.5 hours of idle. Nothing in
          # live-check v0.28.0 caps or drops samples, and the collector must
          # keep sending a copy of all of them, so the pod is recycled
          # instead: scripts/setup-kind.sh and the test gate restart it, and
          # 4Gi covers about 17 hours between restarts. A kill at the limit
          # shows as a changed restartCount, which livecheck.report() fails on.
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 4Gi}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: admin
              containerPort: 4320
          readinessProbe:
            httpGet:
              path: /health
              port: 4320
            periodSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: registry
              mountPath: /registry
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: registry
          configMap:
            name: weaver-registry
        - name: config
          configMap:
            name: weaver-live-check-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weaver-live-check
  namespace: observability
spec:
  selector:
    app: weaver-live-check
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: admin
      port: 4320
      targetPort: 4320

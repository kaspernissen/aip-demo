apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: observability
data:
  # Jaeger v2.20.0's built-in all-in-one config, verbatim except max_traces
  # (see the Deployment's comment). A change here needs a pod restart:
  # setup-kind.sh restarts the Deployment after applying this file.
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, remote_sampling, healthcheckv2, expvar, zpages]
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "${env:JAEGER_LISTEN_HOST:-localhost}"
                    port: 8888
        logs:
          level: info

    extensions:
      jaeger_query:
        storage:
          traces: some_storage
        ai:
          enable_mcp: true

      jaeger_storage:
        backends:
          some_storage:
            memory:
              max_traces: 20000

      remote_sampling:
        file:
          path:
          default_sampling_probability: 1
          reload_interval: 1s
        http:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:5778"
        grpc:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:5779"

      healthcheckv2:
        use_v2: true
        http:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:13133"
        grpc:

      expvar:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:27777"

      zpages:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:27778"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4317"
          http:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4318"

      jaeger:
        protocols:
          grpc:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:14250"
          thrift_http:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:14268"
          thrift_binary:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:6832"
          thrift_compact:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:6831"

      zipkin:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:9411"

    processors:
      batch:

    exporters:
      jaeger_storage_exporter:
        trace_storage: some_storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          # Jaeger v2, not the v1 image (`jaegertracing/all-in-one`): the v1
          # line's last release was October 2024, it is retired upstream, and
          # gets no fixes. Version checked against
          # api.github.com/repos/jaegertracing/jaeger/releases rather than a
          # local image list.
          #
          # **v2.20.0 deliberately, not the newest v2.21.0.** v2.21.0's
          # release notes carry one breaking change: "remove v1 http
          # endpoints the ui no longer calls" (jaegertracing/jaeger#9260).
          # Checked against a v2.21.0 pod: `/api/services` and
          # `/api/traces` return 404 there, and only `/api/v3/*` answers.
          # Those two v1 endpoints are what tests/harness/jaeger.py is built
          # on, and its Span/Trace parsing expects v1 trace JSON -- the v3 API
          # returns OTLP-JSON, a different shape, so moving to 2.21 needs a
          # harness rewrite, not just a version bump. Every e2e trace
          # assertion in this repo runs through that harness, and all of them
          # are gated behind RUN_BROWSER_TESTS, so the breakage would not show
          # up in a local `pytest tests/unit`.
          #
          # v2 is a different program wearing the same name -- it is the
          # OpenTelemetry Collector with Jaeger's storage and UI built in, so
          # the v1 environment variables below do not apply:
          #
          #   COLLECTOR_OTLP_ENABLED  OTLP is always on in v2; there is no
          #                           switch to set.
          #   SPAN_STORAGE_TYPE       storage is chosen in the collector
          #   MEMORY_MAX_TRACES       config, not by env var.
          #
          # **The config is the image's own built-in all-in-one config,
          # mounted from the ConfigMap below with one value changed:
          # `max_traces` 100000 -> 20000** (upstream file:
          # cmd/jaeger/internal/all-in-one.yaml at tag v2.20.0). Why: the
          # in-memory store evicts only by trace count, and at 100000 it never
          # evicted before a 512Mi limit was hit. An OOM kill erases every
          # trace, and those traces are the demo's evidence
          # (`scripts/demo evidence` reads Jaeger). Most traces here
          # are tiny (Kyverno self-checks, about six a minute); the claim
          # traces are a few hundred spans each, so a count cap only bounds
          # memory together with a limit that has headroom: 1Gi below.
          # 20000 still holds a whole test run: oldest traces go first.
          #
          # The image name is `jaegertracing/jaeger`, not
          # `jaegertracing/all-in-one`, which is a v1-only repository.
          #
          # The ports and the v1 query API this repo's harness uses
          # (/api/services, /api/traces, /api/traces/{id} -- tests/harness/
          # jaeger.py) are confirmed against the running pod.
          image: jaegertracing/jaeger:2.20.0
          args: ["--config", "/etc/jaeger/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
          ports:
            - name: query
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: jaeger-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: observability
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      nodePort: 30686

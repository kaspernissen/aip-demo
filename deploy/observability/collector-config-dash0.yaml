receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:8080"
          allowed_headers:
            - "*"

  # SPIRE's own telemetry.
  #
  # SPIRE 1.15.3 has no OpenTelemetry support at all -- no OTLP exporter and no
  # tracing (its telemetry block offers Prometheus, DogStatsD, Statsd, M3 and
  # an in-memory sink and nothing else; see deploy/platform/spire/values.yaml).
  # Prometheus metrics are therefore the only real telemetry it emits, and
  # without this receiver they would be exposed on :9988 and thrown away: a
  # component with no telemetry configured is invisible.
  #
  # Two jobs rather than one with two targets, so the receiver stamps a
  # distinguishable `service.name` (it derives it from job_name) on each side
  # instead of merging the server's and the agent's series under one identity.
  #
  # Scrape targets are the Services in deploy/platform/spire/metrics.yaml; the
  # chart publishes no Service for either metrics port itself. That file records
  # the single-node assumption these static_configs rest on.
  prometheus/spire:
    config:
      scrape_configs:
        - job_name: spire-server
          scrape_interval: 30s
          static_configs:
            - targets: ["spire-server-metrics.northstar-platform.svc.cluster.local:9988"]
        - job_name: spire-agent
          scrape_interval: 30s
          static_configs:
            - targets: ["spire-agent-metrics.northstar-platform.svc.cluster.local:9988"]

processors:
  batch:
    timeout: 1s
  resource_detection:
    detectors: [env]
    override: false

  # BEGIN stage-4-only
  # See collector-config.yaml's own comment on this processor for the full
  # explanation and for why only third-party keys are rewritten. This file
  # must carry the identical block -- tests/unit/test_collector_configs_in_sync.py
  # requires the two files' `processors` sections to be equal.
  #
  # This is a *processor in the OpenSearch branch* rather than a change to
  # what the services emit: in THIS file, `otlp_grpc/dash0` exports from the
  # main `traces` pipeline, upstream of the `forward/opensearch` tee, so
  # Dash0 receives every canonical key exactly as
  # Jaeger does. The `traces/opensearch` pipeline below deliberately does NOT
  # list `otlp_grpc/dash0`, which is the one documented exception to this
  # repo's "every pipeline gets the Dash0 exporter too" rule.
  attributes/opensearch-compat:
    actions:
      # Kyverno's admission spans (stage 7) emit `admission.request.kind` -- an
      # empty string -- next to `admission.request.kind.{group,kind,version}`,
      # which OpenSearch would have to map as an object. The keys are
      # Kyverno's own, so the source scan in tests/unit/test_stage4_config.py
      # cannot see them; THIRD_PARTY_COLLISIONS there pins them instead.
      # Without these renames OpenSearch rejects every batch that carries a
      # Kyverno span, and the Northstar spans in the same batch with it.
      - key: admission.request.kind_group
        from_attribute: admission.request.kind.group
        action: insert
      - key: admission.request.kind.group
        action: delete
      - key: admission.request.kind_kind
        from_attribute: admission.request.kind.kind
        action: insert
      - key: admission.request.kind.kind
        action: delete
      - key: admission.request.kind_version
        from_attribute: admission.request.kind.version
        action: insert
      - key: admission.request.kind.version
        action: delete
      # agentgateway v1.6.0 marks a refused `tools/call` SERVER span with
      # `error` (true) AND `error.type` ("MCP"): a scalar and a dotted
      # extension of it, which OpenSearch cannot map. v1.5.0 wrote `error`
      # alone. Measured 2026-10-13; pinned by THIRD_PARTY_COLLISIONS in
      # tests/unit/test_stage4_config.py. The mapping is index-wide, so this
      # applies to every service's `error.type`.
      - key: error_type
        from_attribute: error.type
        action: insert
      - key: error.type
        action: delete
  # END stage-4-only

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger.observability.svc.cluster.local:4317
    tls:
      insecure: true
  otlp_grpc/dash0:
    endpoint: ${env:DASH0_GRPC_HOSTNAME}:${env:DASH0_GRPC_PORT}
    headers:
      Authorization: "Bearer ${env:DASH0_AUTH_TOKEN}"
      Dash0-Dataset: "${env:DASH0_DATASET}"
  debug:
    verbosity: normal

  # BEGIN stage-4-only
  # See collector-config.yaml's own comment on this exporter for the full
  # reasoning -- this file must carry the identical block
  # (tests/unit/test_collector_configs_in_sync.py enforces agreement on every
  # exporter except otlp_grpc/dash0).
  opensearch/trace:
    http:
      endpoint: http://opensearch-cluster-master.observability.svc.cluster.local:9200
  # END stage-4-only

  # BEGIN stage-4-only
  # See collector-config.yaml's own comment on this exporter for the full
  # reasoning -- this file must carry the identical block
  # (tests/unit/test_collector_configs_in_sync.py enforces agreement on every
  # exporter except otlp_grpc/dash0).
  opensearch/logs:
    http:
      endpoint: http://opensearch-cluster-master.observability.svc.cluster.local:9200
  # END stage-4-only

  # BEGIN stage-4-only
  # Prometheus, fed by the collector rather than scraping anything: the
  # services below set no `OTEL_METRICS_*` variable and know nothing about
  # Prometheus, they export OTLP to this collector exactly as they already do
  # for traces, and this exporter is the whole routing change that gets those
  # metrics to Prometheus with no application change and no scrape
  # configuration.
  #
  # The endpoint path is a BASE path: the otlp_http exporter appends the
  # signal's own suffix, so what is actually POSTed is
  # `/api/v1/otlp/v1/metrics`, which is the path Prometheus v3.14.0 serves
  # once `--web.enable-otlp-receiver` is passed (see
  # deploy/observability/prometheus/values.yaml, which reads that flag's
  # spelling out of v3.14.0's own cmd/prometheus/main.go:475 rather than from
  # memory).
  #
  # `9090`, and the Service really is called `prometheus`: both are overrides
  # in that values file, not chart defaults -- the chart would publish
  # `prometheus-server` on port 80. If this endpoint ever stops resolving,
  # check `server.fullnameOverride` and `server.service.servicePort` there
  # first.
  #
  # `tls.insecure: true` is INERT for this endpoint: the scheme in `endpoint`
  # decides, and `http://` never negotiates TLS for the setting to relax. It
  # is named here as inert so nobody later reads it as evidence that a TLS
  # listener exists.
  #
  # `otlp_http/`, not `otlphttp/`: the pinned collector image
  # (otel/opentelemetry-collector-contrib:0.162.0, see .env) accepts both and
  # says so on startup, verbatim from
  # `kubectl -n observability logs deploy/otel-collector`:
  #
  #   warn  builders/builders.go:40  "otlphttp" alias is deprecated; use
  #   "otlp_http" instead  {... "otelcol.component.id": "otlp_http/prometheus",
  #   "otelcol.component.kind": "exporter", "otelcol.signal": "metrics"}
  #
  # `otlp_http/` is used consistently, matching the two exporters above it --
  # this file spells the grpc one `otlp_grpc/`, not `otlpgrpc/`.
  otlp_http/prometheus:
    endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/otlp
    tls:
      insecure: true
  # END stage-4-only

  # BEGIN stage-4-only
  # A COPY of everything for Weaver live-check (M9). Never a sample: the
  # registry is checked against the same traffic every backend receives.
  otlp_grpc/weaver:
    endpoint: weaver-live-check.observability.svc.cluster.local:4317
    tls: {insecure: true}
    # Weaver's OTLP receiver does not accept gzip (measured: `Unimplemented:
    # Content is compressed with `gzip` which isn't supported`, every batch
    # dropped as a permanent error), and the exporter's default is gzip.
    compression: none
    # The pod behind this endpoint is replaced by the gate (a rollout), and the
    # old connection can be black-holed rather than reset. Without pings the
    # exporter keeps writing to it until the TCP timeout, minutes later; with
    # them it notices in ~15s and reconnects to the new pod.
    keepalive:
      time: 10s
      timeout: 5s
      permit_without_stream: true
    sending_queue: {enabled: true}
    retry_on_failure: {enabled: true}
  # END stage-4-only

  # BEGIN stage-4-only
  # A COPY of every trace for AgentEvals (M11). Identical to
  # collector-config.yaml's; see that file for why.
  otlp_http/agentevals:
    endpoint: http://agentevals.observability.svc.cluster.local:4318
    sending_queue: {enabled: true}
    retry_on_failure: {enabled: true}
  # END stage-4-only

# BEGIN stage-4-only
# The `forward/` connector tee. Identical to collector-config.yaml's; see
# that file for why.
connectors:
  forward/opensearch: {}
# END stage-4-only

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource_detection, batch]
      # One exporter per line so scripts/setup-kind.sh can strip the
      # stage-4-only entry below stage 4 with the same marker rule it uses for
      # every other block here.
      exporters:
        - otlp_grpc/jaeger
        # BEGIN stage-4-only
        - forward/opensearch
        - otlp_grpc/weaver
        - otlp_http/agentevals
        # END stage-4-only
        - otlp_grpc/dash0
        - debug
    # BEGIN stage-4-only
    # No `otlp_grpc/dash0` here, deliberately, and it is the one pipeline in
    # either file without it: this branch carries the OpenSearch-compat
    # rewrite, and Dash0 must receive the canonical attribute names. Adding
    # Dash0 here would both duplicate every span in Dash0 and duplicate it
    # under a renamed attribute.
    # tests/unit/test_collector_configs_in_sync.py encodes that exception.
    traces/opensearch:
      receivers: [forward/opensearch]
      processors: [attributes/opensearch-compat]
      exporters: [opensearch/trace]
    # END stage-4-only
    metrics:
      receivers: [otlp, prometheus/spire]
      processors: [batch]
      # One exporter per line, for the same reason the traces pipeline above is
      # written that way: scripts/setup-kind.sh strips the stage-4-only entry
      # below stage 4 with a line-range sed, and it cannot edit inside a flow
      # sequence. Below stage 4 this list is `otlp_grpc/dash0` and `debug`
      # only: the collector must not name a backend the cluster does not have.
      exporters:
        # BEGIN stage-4-only
        - otlp_http/prometheus
        - otlp_grpc/weaver
        # END stage-4-only
        - otlp_grpc/dash0
        - debug
    logs:
      receivers: [otlp]
      processors: [batch]
      # One exporter per line, matching collector-config.yaml's logs pipeline
      # -- see that file's comment.
      exporters:
        # BEGIN stage-4-only
        - opensearch/logs
        - otlp_grpc/weaver
        # END stage-4-only
        - otlp_grpc/dash0
        - debug

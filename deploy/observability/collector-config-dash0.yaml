receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:8080"
          allowed_headers:
            - "*"

processors:
  batch:
    timeout: 1s
  resource_detection:
    detectors: [env]
    override: false

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger.observability.svc.cluster.local:4317
    tls:
      insecure: true
  otlp_grpc/dash0:
    endpoint: ${env:DASH0_GRPC_HOSTNAME}:${env:DASH0_GRPC_PORT}
    headers:
      Authorization: "Bearer ${env:DASH0_AUTH_TOKEN}"
      Dash0-Dataset: "${env:DASH0_DATASET}"
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource_detection, batch]
      exporters: [otlp_grpc/jaeger, otlp_grpc/dash0, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/dash0, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/dash0, debug]

# reviewer-ui: the HITL stage surface.
#
# Its own ServiceAccount, for the same reason settlement-agent.yaml's own
# comment gives: without one this pod attests as
# spiffe://northstar.local/ns/northstar-agents/sa/default, an identity a
# policy cannot decide on. It grants no RBAC and this pod makes no Kubernetes
# API call.
#
# This identity now releases money: the reviewer-ui calls execute_payment
# through agentgateway under its own JWT-SVID, and the Policy Decision Service
# permits it under `human-approved.execute` only for a payment the ledger shows
# awaiting approval (platform/policy-decision-service/pds/rules.py,
# HUMAN_APPROVERS). Because of that it is named in-tree as a ClusterSPIFFEID
# (deploy/platform/spire/registration.yaml, northstar-reviewer-ui) rather than
# left to the chart's fallback. The CSI volume below mounts the Workload API
# socket for both uses: its own X.509 SPIFFE ID for the `review.decision` span,
# and the JWT-SVID it presents to the gateway. Its egress is allow-listed to
# payments-api (read, reject) and agentgateway (release)
# (deploy/platform/cilium-policies.yaml, reviewer-ui-egress-allowlist).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reviewer-ui
  namespace: northstar-agents
  labels:
    app: reviewer-ui
    northstar.io/plane: agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewer-ui
  namespace: northstar-agents
  labels:
    app: reviewer-ui
    northstar.io/plane: agents
    northstar.io/owner: claims-team
    # Read by @backstage/plugin-kubernetes-backend's default
    # label selector (`backstage.io/kubernetes-id=<entity name>`), so this
    # Component's catalog entry (apps/reviewer-ui/catalog-info.yaml) shows
    # its live workload. Added to the Pod template below too -- the plugin
    # queries Pods, not just Deployments.
    backstage.io/kubernetes-id: reviewer-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviewer-ui
  template:
    metadata:
      labels:
        app: reviewer-ui
        northstar.io/plane: agents
        northstar.io/owner: claims-team
        backstage.io/kubernetes-id: reviewer-ui
    spec:
      serviceAccountName: reviewer-ui
      containers:
        - name: reviewer-ui
          # Images go through the local registry, never `kind load`.
          image: localhost:5001/northstar/reviewer-ui:dev
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: reviewer-ui
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # The ledger listing, read and reject routes, reached directly --
            # no MCP hop, they move no money. See
            # apps/reviewer-ui/ledger.py's module docstring for why.
            - name: PAYMENTS_API_URL
              value: http://payments-api.northstar-systems.svc.cluster.local:8080
            # The release: execute_payment through agentgateway, the same
            # governed path the settlement-agent uses, under this workload's
            # own JWT-SVID (apps/reviewer-ui/gateway.py).
            - name: AGENTGATEWAY_MCP_URL
              value: http://agentgateway.northstar-platform.svc.cluster.local:3000/mcp
            - name: NORTHSTAR_GATEWAY_AUDIENCE
              value: spiffe://northstar.local/ns/northstar-platform/sa/agentgateway
            - name: PORT
              value: "8080"
            # The Workload API socket path: this workload's own SPIFFE ID, and
            # the JWT-SVID it presents to the gateway (see the header comment).
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
          ports:
            - name: http
              containerPort: 8080
          # Mirrors payments-api's own /healthz: a plain 200, no ledger call,
          # no SPIFFE fetch -- startup finishing is what this proves, the same
          # "probe traffic must not need the thing it is proving" argument
          # systems/payments-api/handlers.go's own comment makes for its
          # /healthz route.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
          # Both memory figures are measured, not guessed. They replace
          # `requests: 32Mi` / `limits: 64Mi`, which were
          # estimates and were wrong in the direction that looks like nothing:
          # this pod OOMKilled three times during load testing
          # (`kubectl get pod` restart count 3, and the container's own
          # `lastState.terminated` reads `exitCode: 137, reason: OOMKilled`),
          # self-recovered each time, and would have turned an ordinary gate
          # run -- or a live demo -- into a false failure.
          #
          # HOW THEY WERE MEASURED. There is no metrics-server on this kind
          # cluster, so `kubectl top pod` answers "Metrics API not available".
          # The numbers below are read straight off the container's own cgroup
          # v2 accounting instead, which is what `kubectl top` would be
          # summarising anyway:
          #
          #   kubectl -n northstar-agents exec deploy/reviewer-ui -- \
          #     sh -c 'head -1 /sys/fs/cgroup/memory.current; \
          #            head -1 /sys/fs/cgroup/memory.peak'
          #
          # `memory.peak` is the high-water mark since the container started,
          # so each figure below was taken after a `rollout restart` and one
          # load shape, against a temporarily raised limit so the kernel could
          # not cap the very number being measured:
          #
          #   idle, just after startup        ~55 MiB peak
          #   60 sequential  GET /            ~75 MiB peak
          #   100 GET / at concurrency 10     ~72 MiB peak
          #   200 GET / fully concurrent     ~210 MiB peak
          #
          # The 64Mi limit was below even the IDLE figure's neighbourhood
          # (idle `memory.current` measured 57 MiB against a 64 MiB cap, ~7 MiB
          # of headroom), and the 200-concurrent burst reproduced the OOMKill
          # on the old limit directly -- so this is the limit's own fault, not
          # a symptom of something else.
          #
          # `limits.memory: 256Mi` covers the worst shape measured (210 MiB)
          # rather than only the realistic ones, because a limit is the figure
          # a crash depends on and this node has 29 GiB allocatable.
          # `requests.memory: 96Mi` is set from the realistic peak (~75 MiB)
          # instead: requests are what the scheduler reserves, and reserving
          # the pathological figure would misreport what this pod normally
          # needs. cpu is left at the original 25m -- nothing about the
          # OOMKills implicated it, and it was not measured, so it is not
          # changed.
          #
          # CONFIRMED AFTER THE FACT, against real traffic rather than a
          # synthetic burst: read back immediately after the full gate run
          # (`RUN_BROWSER_TESTS=1 ./scripts/smoke-test.sh`, which drives real
          # browser approvals through this page), `memory.peak` = 65,171,456 B
          # = 62.2 MiB, `memory.max` = 268,435,456 B = 256 MiB as set, restart
          # count 0. Two things follow. The new limit has roughly 4x headroom
          # over the real workload, so it is not tight. And the old 64Mi limit
          # left about 1.8 MiB against that same workload -- the gate would
          # probably have passed on it this once, which is exactly why the
          # OOMKills read as intermittent rather than as a limit that was
          # simply too low.
          resources:
            requests:
              memory: 96Mi
              cpu: 25m
            limits:
              memory: 256Mi
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        # Same CSI driver every other identity-bearing workload in this
        # namespace mounts (deploy/k8s/settlement-agent.yaml's own comment
        # explains the chart and the driver name in full).
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: reviewer-ui
  namespace: northstar-agents
spec:
  type: NodePort
  selector:
    app: reviewer-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081

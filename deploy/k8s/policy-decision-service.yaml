# The Policy Decision Service: the platform component that decides whether a
# call becomes an effect, given who is calling.
#
# agentgateway calls it over gRPC on every MCP `tools/call`
# (`mcpGuardrails` in deploy/platform/agentgateway/config.yaml) and it answers
# permit or deny. It is the only thing standing between settlement-agent's
# €6,200 execute_payment and payments-api actually moving the money.
#
# It lives in `northstar-platform`, with the gateway and SPIRE, rather than in
# `northstar-tools` or beside the agents: it is platform machinery, not a tool
# an agent may call and not an agent's own dependency. Nothing in
# northstar-agents can reach it (see deploy/platform/cilium-policies.yaml).
---
# A dedicated ServiceAccount, for the same reason
# deploy/k8s/settlement-agent.yaml and deploy/platform/agentgateway/deployment.yaml
# each have one: SPIRE's ID template is
# spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}
# (deploy/platform/spire/registration.yaml), so a pod running as `default`
# attests as `spiffe://northstar.local/ns/northstar-platform/sa/default` -- an
# identity that verifies perfectly and identifies nothing.
#
# Grants no RBAC. This pod makes no Kubernetes API calls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-decision-service
  namespace: northstar-platform
  labels:
    app: policy-decision-service
    northstar.io/plane: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-decision-service
  namespace: northstar-platform
  labels:
    app: policy-decision-service
    northstar.io/plane: platform
    # Read by @backstage/plugin-kubernetes-backend's default
    # label selector (`backstage.io/kubernetes-id=<entity name>`), so this
    # Component's catalog entry (platform/policy-decision-service/
    # catalog-info.yaml) shows its live workload. Added to the Pod template
    # below too -- the plugin queries Pods, not just Deployments.
    backstage.io/kubernetes-id: policy-decision-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-decision-service
  template:
    metadata:
      labels:
        app: policy-decision-service
        northstar.io/plane: platform
        backstage.io/kubernetes-id: policy-decision-service
      # These two annotations are what the Open Feature Operator's
      # mutating webhook reads to inject the flagd sidecar into this pod at
      # admission time. `featureflagsource` names
      # deploy/platform/openfeature/featureflagsource.yaml, whose `port: 8013`
      # is what makes the sidecar answer on localhost:8013 -- the address
      # the PDS code resolves the `autonomy-level` flag against.
      annotations:
        openfeature.dev/enabled: "true"
        openfeature.dev/featureflagsource: "northstar-autonomy-source"
    spec:
      serviceAccountName: policy-decision-service
      containers:
        - name: policy-decision-service
          # scripts/rebuild-and-deploy.sh's convention:
          # localhost:5001/northstar/<component>:dev, built from
          # platform/policy-decision-service and pushed to the kind registry.
          # `Always` because the tag never changes -- a rebuilt `:dev` would
          # otherwise be ignored in favour of the node's cached layer.
          image: localhost:5001/northstar/policy-decision-service:dev
          imagePullPolicy: Always
          env:
            # The same three OTLP variables every other service here sets, so
            # the `policy.decision` span reaches the same collector and lands
            # in the same trace as the gateway's `tools/call` and the model's
            # reasoning. pds/telemetry.py reads them through the standard
            # `OTEL_EXPORTER_OTLP_*` names rather than any of our own, so this
            # manifest is the only place they are named.
            - name: OTEL_SERVICE_NAME
              value: policy-decision-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          # No OTEL_SEMCONV_STABILITY_OPT_IN here, unlike the three services
          # that set it: that opt-in converges *HTTP client* instrumentation on
          # the stable attribute spelling, and this service makes no outbound
          # HTTP call of its own except the exporter's, which is not
          # instrumented. Setting it would be cargo-culted from a sibling
          # manifest rather than doing anything.
          ports:
            - name: grpc
              containerPort: 9100
          # A TCP-socket probe on the gRPC port, NOT a gRPC health
          # check. `grpcio-health-checking` is deliberately outside this
          # service's pinned dependency closure (requirements.txt), and
          # adding it would mean re-resolving that whole closure. A TCP
          # connect proves the gRPC server has called
          # `add_insecure_port` and `start()`, which is the transition this
          # probe exists to detect; it cannot prove the servicer is registered,
          # and pds/server.py registers it before the port is opened.
          #
          # This probe is load-bearing in a way it would not be under
          # fail-open. The gateway's guardrail is `failureMode: failClosed`, so
          # a PDS the gateway cannot reach refuses every payment. A pod that
          # never becomes Ready therefore does not degrade the demo, it stops
          # it -- and it stops it with a refusal that looks exactly like a
          # policy denial to anyone reading the agent's reply. That is also why
          # the ingress network policy for this pod must admit the node:
          # kubelet dials this probe from the host, and a dropped probe
          # packet becomes "every payment refused", with nothing in the output
          # mentioning networking.
          readinessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 2
          # A liveness probe as well, which the other services here do not
          # have, for a reason specific to this one: `pds/server.py`'s main
          # thread blocks on a `threading.Event` and the gRPC server runs on a
          # thread pool, so a process that has stopped serving does not
          # necessarily exit. Under fail-closed a wedged-but-running PDS is
          # indistinguishable from a policy that refuses everything, so it is
          # worth restarting rather than leaving up.
          livenessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
          # Matched to payments-mcp's values, which is the closest comparable
          # workload in this repo: a CPython 3.13 service whose footprint is
          # interpreter plus one framework (grpcio and the OTel SDK here). No
          # independent measurement of this pod's idle RSS is published,
          # deliberately -- the numbers below are a sibling's measurement
          # reused, not this one's.
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: policy-decision-service
  namespace: northstar-platform
spec:
  selector:
    app: policy-decision-service
  ports:
    - name: grpc
      port: 9100
      targetPort: 9100

# M6 Task 1: Backstage, the view over the platform API this milestone puts a
# UI on. Design: docs/superpowers/specs/2026-09-15-northstar-m6-golden-path-
# design.md §3 (the shape), §4 (the security boundary).
#
# It lives in `northstar-platform`, with the gateway, SPIRE, the PDS and
# eval-scorer, for the same reason all four of those do: platform machinery,
# not a tool an agent may call and not an agent's own dependency. No agent
# knows this exists.
#
# **This task grants READ-ONLY.** The ServiceAccount below carries the
# Kubernetes-plugin's read RBAC (§4: "the Kubernetes plugin's read access and
# the contract card's write access are two different ServiceAccounts"). The
# SECOND ServiceAccount -- the one that can PATCH
# featureflags.core.openfeature.dev -- is Task 3's, deliberately not this
# task's, so the two grants are reviewed and can be revoked separately.
#
# No SPIRE ClusterSPIFFEID is registered for this pod. Nothing Backstage does
# is on the SPIFFE-verified path (it calls the Kubernetes API with this
# ServiceAccount's own bearer token, not through agentgateway), so -- unlike
# eval-scorer, which took one purely so the answer would be its own name if
# something ever did check -- nothing here checks one either. Revisit if a
# later task puts Backstage behind SPIRE-verified ingress.
---
# A dedicated ServiceAccount, for the same measured reason every workload in
# this repo has one (see deploy/k8s/eval-scorer.yaml's identical note): a pod
# running as `default` attests as `.../sa/default`, an identity that verifies
# perfectly and identifies nothing. This one additionally CARRIES RBAC, unlike
# eval-scorer's or the PDS's own ServiceAccount -- see the ClusterRole below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: northstar-platform
  labels:
    app: backstage
    northstar.io/plane: platform
---
# Read-only, cluster-scoped because the eight catalog components this
# ServiceAccount's Kubernetes plugin will show (Task 2) span four namespaces --
# northstar-agents, northstar-tools, northstar-systems, northstar-platform --
# and a catalog entry's owner does not always match the namespace Backstage
# itself runs in. `get`/`list`/`watch` only: no `create`, `update`, `patch` or
# `delete` anywhere in this Role, and no Secrets at all -- matching design §4's
# "no access to Secrets ... beyond what the read-only Kubernetes plugin needs"
# (the plugin needs none). ConfigMaps ARE included: Backstage's
# @backstage/plugin-kubernetes-backend reads them by default alongside Pods,
# Deployments, ReplicaSets, Services, HorizontalPodAutoscalers, Ingresses,
# StatefulSets, LimitRanges, Jobs, CronJobs and Events -- the same default
# object-type list upstream's docs publish -- which is what design §4 means by
# "beyond what the plugin needs": this Role grants exactly that list, nothing
# past it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-read-only
  labels:
    app: backstage
    northstar.io/plane: platform
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - limitranges
      # `resourcequotas` was MISSING until 2026-09-15, and it is the one gap in
      # this list a user actually sees. `@backstage/plugin-kubernetes-backend`
      # fetches LimitRange and ResourceQuota as a pair in its default object
      # set; this list took the first and not the second, so every entity page
      # rendered a red banner -- "There was a problem retrieving some
      # Kubernetes resources for the entity: policy-decision-service ...
      # '/api/v1/namespaces/northstar-platform/resourcequotas', error:
      # UNKNOWN_ERROR, status code: 403". Nothing was broken underneath it: the
      # plugin degrades to a warning and still renders every other resource,
      # which is exactly why no test and no health check ever went red. It was
      # found by opening the page.
      #
      # Read-only like every other rule here, and still no Secrets.
      - resourcequotas
      - events
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # No metrics.k8s.io rule: this cluster installs no metrics-server (verified
  # 2026-09-15, `kubectl get apiservices` -- no such APIService registered),
  # so granting it would be RBAC for an API nothing here serves. Add it in the
  # same change that adds metrics-server, not before.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-read-only
  labels:
    app: backstage
    northstar.io/plane: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-read-only
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: northstar-platform
---
# M6 Task 3: the SECOND ServiceAccount, promised by Task 1's own comment above
# and by design §4. This is the write grant -- "Backstage can see the
# cluster" (backstage-read-only, above) and "Backstage can change policy"
# (this) are separate objects, bound to separate ServiceAccounts, so either
# can be revoked without touching the other. M6-R5 (progress ledger): this
# ServiceAccount is the card's OWN read *and* write -- it is not layered on
# top of the read-only ClusterRole, and the read-only ClusterRole must never
# be widened to give the card its `get`. Widening it would put the narrow
# grant's read behind the broad grant's identity, defeating the separation
# design §4 asks for.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-autonomy-writer
  namespace: northstar-platform
  labels:
    app: backstage
    northstar.io/plane: platform
---
# Namespaced Role, not ClusterRole: the one resource this grant ever touches
# lives in `northstar-platform` and nowhere else, so a namespaced Role is the
# tighter of the two, unlike backstage-read-only's ClusterRole (which needs
# cluster scope because the catalog it reads spans four namespaces). Design
# §4, verbatim: "get/list/patch on featureflags ... restricted by
# resourceNames to northstar-autonomy alone. Not `*`, not cluster-wide, not
# other verbs. No `delete`."
#
# `list` is granted alongside `get` because @kubernetes/client-node's
# CustomObjectsApi -- used here exactly as the read-only ClusterRole's own
# Kubernetes plugin uses it -- issues a LIST-shaped watch/refresh call in some
# client code paths even when the caller only ever wants one named object;
# `resourceNames` still confines it to `northstar-autonomy` (the API server
# enforces resourceNames on `list`/`watch` by filtering to the named objects,
# not by rejecting the verb outright), so this does not admit reading any
# other FeatureFlag.
#
# tests/unit/test_autonomy_writer_rbac.py pins every clause of this Role by
# parsing the manifest; tests/e2e/test_autonomy_writer_live_rbac.py proves the
# same claims against the live API server with
# `kubectl auth can-i --as=system:serviceaccount:northstar-platform:backstage-autonomy-writer`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-autonomy-writer
  namespace: northstar-platform
  labels:
    app: backstage
    northstar.io/plane: platform
rules:
  - apiGroups: ["core.openfeature.dev"]
    resources: ["featureflags"]
    resourceNames: ["northstar-autonomy"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-autonomy-writer
  namespace: northstar-platform
  labels:
    app: backstage
    northstar.io/plane: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-autonomy-writer
subjects:
  - kind: ServiceAccount
    name: backstage-autonomy-writer
    namespace: northstar-platform
---
# The mechanism that lets ONE pod (the Backstage Deployment below) hold TWO
# ServiceAccounts' worth of credentials. A Pod has exactly one
# `spec.serviceAccountName`, and a projected `serviceAccountToken` volume can
# only ever mint a token for THAT ServiceAccount -- there is no kubelet
# mechanism to project a token for a second, named ServiceAccount into a pod
# whose own identity is the first. So the write grant's credential has to
# reach the pod a different way: a long-lived token Secret, bound to
# `backstage-autonomy-writer` by the annotation below, mounted as an ordinary
# volume. Kubernetes still supports this ("service account token Secrets",
# https://kubernetes.io/docs/concepts/configuration/secret/#service-account-token-secrets)
# specifically for cases like this one.
#
# This does NOT require `get secrets` RBAC on backstage-read-only or on
# backstage-autonomy-writer -- neither Role grants it, and neither needs it.
# Mounting a Secret named explicitly in a Pod spec is a deployment-time
# decision made by whoever applies this manifest (scripts/setup-kind.sh /
# rebuild-and-deploy.sh, both operator-driven); it is not something the
# running pod's own RBAC could use to go discover or read *other* Secrets. A
# ServiceAccount that could list arbitrary Secrets and one that has this one
# named Secret's contents handed to it by the kubelet are different
# privileges, and design §4's "no access to Secrets" is about the former --
# tests/unit/test_autonomy_writer_rbac.py asserts neither Role in this file
# ever grants it.
#
# THAT IS ONLY THE FAVOURABLE HALF of this trade-off, and a comment that
# states only the favourable half is worse than no comment -- it reads as
# having weighed the question when it has not (M6 task-3 review, M1/M6-R10;
# full accounting in design §10). The unfavourable half, measured by
# decoding both tokens live in the running pod: this Secret's token has NO
# `exp`, NO `aud`, and NO binding to a pod or object -- unlike the pod's own
# kubelet-projected token (backstage-read-only's, mounted automatically),
# which has all three and rotates. Both token files sit `0644` in the SAME
# mount namespace of the SAME single Node process that also runs the
# scaffolder, techdocs, the proxy and mcp-actions under guest auth and an
# allow-all permission policy (packages/backend/src/index.ts). So: a
# compromise of the read-only identity yields a token that expires and is
# audience-bound; a compromise of THIS process also yields a bearer token
# that can patch `northstar-autonomy` forever, from anywhere -- surviving
# this pod's deletion and a fix to whatever let the compromise happen -- and
# nothing here monitors for that Secret being used. The more dangerous grant
# got the WEAKER credential mechanism, not a matching one. The structural
# fix -- a separate Deployment running as `backstage-autonomy-writer`,
# called over HTTP from this one, so a Backstage compromise yields the
# ability to ASK for the write rather than a credential to KEEP -- was not
# built. That is carried as recorded debt (design §10), not a judgment that
# the trade-off is fine: Kasper is time-pressured and this milestone is
# scoped lean. Read design §10 before repeating only the first half of this
# comment elsewhere.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-autonomy-writer-token
  namespace: northstar-platform
  labels:
    app: backstage
    northstar.io/plane: platform
  annotations:
    kubernetes.io/service-account.name: backstage-autonomy-writer
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: northstar-platform
  labels:
    app: backstage
    northstar.io/plane: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
        northstar.io/plane: platform
    spec:
      serviceAccountName: backstage
      containers:
        - name: backstage
          # scripts/rebuild-and-deploy.sh's convention:
          # localhost:5001/northstar/<component>:dev, built from
          # platform/backstage and pushed to the kind registry. `Always`
          # because the tag never changes -- a rebuilt `:dev` would otherwise
          # be ignored in favour of the node's cached layer.
          image: localhost:5001/northstar/backstage:dev
          imagePullPolicy: Always
          env:
            # M6 Task 3: where the autonomy-contract backend plugin
            # (platform/backstage/packages/backend/src/plugins/autonomyContract)
            # finds the SECOND ServiceAccount's credential -- see the
            # backstage-autonomy-writer-token Secret and its mount below.
            # Never the pod's own default-mounted token
            # (/var/run/secrets/kubernetes.io/serviceaccount/token, which is
            # backstage-read-only's and cannot patch anything).
            - name: NORTHSTAR_AUTONOMY_WRITER_TOKEN_PATH
              value: /var/run/secrets/northstar/autonomy-writer/token
            - name: NORTHSTAR_AUTONOMY_WRITER_CA_PATH
              value: /var/run/secrets/northstar/autonomy-writer/ca.crt
            - name: NORTHSTAR_AUTONOMY_NAMESPACE
              value: northstar-platform
            - name: NORTHSTAR_AUTONOMY_FLAG_NAME
              value: northstar-autonomy
            # The same three OTLP variables every other service in this
            # cluster sets (deploy/k8s/eval-scorer.yaml, deploy/k8s/policy-
            # decision-service.yaml, ...), read by
            # plugins/autonomyContract/telemetry.ts through the standard
            # `OTEL_EXPORTER_OTLP_*` names. This did not exist before Task 3:
            # Task 1's Backstage made no decision and changed nothing, so it
            # emitted nothing. The card's write does both, so it is the first
            # thing in this manifest with anything to say to the collector --
            # design §4's auditability clause, discharged as telemetry rather
            # than left as a claim in a comment.
            - name: OTEL_SERVICE_NAME
              value: backstage
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          ports:
            - name: http
              containerPort: 7007
          # No documented `/healthcheck` route exists in this scaffold
          # (verified: grepping the installed @backstage/* packages for one
          # turns up nothing, and the same absence is why
          # deploy/k8s/policy-decision-service.yaml settles for a TCP probe
          # rather than a richer health check). A TCP connect proves
          # rootHttpRouter has bound :7007, which is the transition that
          # matters here -- it cannot prove every plugin finished
          # initializing, but nothing downstream of this pod blocks on that
          # the way a payment blocks on the PDS, so the same tradeoff PDS's
          # own note argues applies here too.
          readinessProbe:
            tcpSocket:
              port: 7007
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 7007
            initialDelaySeconds: 20
            periodSeconds: 10
          # Measured 2026-09-15 against this pod, warm and idle 30s after
          # rollout (this cluster has no metrics-server, so `kubectl top` is
          # unavailable -- measured instead with
          # `kubectl exec deploy/backstage -- cat /proc/1/status` and
          # cross-checked with `crictl stats` on the kind node): steady-state
          # VmRSS **~368 MiB** (376924 kB). Backstage is a Node backend
          # bundling the catalog, scaffolder, search, auth, kubernetes and
          # techdocs plugins in one process, so its footprint is well past the
          # Python services' 96-256Mi. Request set just above the measured
          # steady state; limit leaves roughly 2.6x headroom for the
          # catalog/search-indexing burst on startup and on a rollout, the
          # same "peak vs realistic" split reviewer-ui's own note
          # (deploy/k8s/reviewer-ui.yaml) uses.
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 1Gi
          volumeMounts:
            # Read-only, and this is the ONLY thing this mount does: hand the
            # kubelet-populated token/CA for backstage-autonomy-writer to the
            # one route that needs it. It is a second credential sitting
            # beside the pod's own automounted backstage-SA token, not a
            # replacement for it -- the Kubernetes plugin keeps using the
            # pod's own (read-only) identity exactly as Task 1 left it.
            - name: autonomy-writer-token
              mountPath: /var/run/secrets/northstar/autonomy-writer
              readOnly: true
      volumes:
        - name: autonomy-writer-token
          secret:
            secretName: backstage-autonomy-writer-token
            # `token` and `ca.crt` are populated onto this Secret by the
            # cluster's own service-account-token controller once it exists
            # (verified live, 2026-09-15: both keys present within a few
            # seconds of `kubectl apply`) -- nothing here writes them.
            optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: northstar-platform
spec:
  selector:
    app: backstage
  ports:
    - name: http
      port: 7007
      targetPort: 7007

apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-agent
  namespace: northstar-agents
  labels:
    app: settlement-agent
    northstar.io/plane: agents
    northstar.io/owner: claims-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-agent
  template:
    metadata:
      labels:
        app: settlement-agent
        northstar.io/plane: agents
        northstar.io/owner: claims-team
    spec:
      containers:
        - name: settlement-agent
          image: localhost:5001/northstar/settlement-agent:dev
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: settlement-agent
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # opentelemetry-instrumentation-httpx==0.65b0 emits the legacy HTTP
            # attribute spelling (http.method, http.url, http.status_code) by
            # default; this opt-in converges the outbound calls this agent
            # makes to payments-mcp onto the stable spelling (A13). Verified
            # empirically — see NOTES.md.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            - name: PAYMENTS_MCP_URL
              value: http://payments-mcp.northstar-tools.svc.cluster.local:8000/mcp
            - name: AGENT_CARD_PATH
              value: /app/agent-card.json
            - name: PORT
              value: "9002"
            # M1.2: the settlement decision is a real model call. settlement.py
            # reads this variable (falling back to the same literal) and hands
            # it straight to PydanticAI's Agent.
            - name: NORTHSTAR_SETTLEMENT_MODEL
              value: "anthropic:claude-sonnet-5"
            # M1.2 Task 5: prompt/completion capture is configuration, not a
            # hardcoded constant. bootstrap.capture_content_enabled() reads
            # this (defaulting to ON if unset) and hands it straight to
            # PydanticAI's InstrumentationSettings(include_content=...). See
            # docs/telemetry-contract.md's "Content capture" section for why
            # the default is ON, not OFF.
            - name: NORTHSTAR_CAPTURE_CONTENT
              value: "true"
            # Created by scripts/setup-kind.sh from the sourced .env.
            # `optional: true` deliberately, matching how the repo treats its
            # other degradable secret (dash0-secrets): with no key present the
            # pod still starts, stays traced and serves its agent card — only
            # the model call itself fails, with a credential error the logs
            # name. A required secretKeyRef would instead hold the pod in
            # CreateContainerConfigError, which reads as a broken deployment
            # rather than a missing credential.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: northstar-model
                  key: ANTHROPIC_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 9002
          # S6 (final-review.md): see claims-agent.yaml for the same fix and
          # reasoning — this endpoint is read from disk at build_app() time.
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9002
            initialDelaySeconds: 2
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-agent
  namespace: northstar-agents
spec:
  selector:
    app: settlement-agent
  ports:
    - name: http
      port: 9002
      targetPort: 9002

# M2.1 Task 4: a dedicated ServiceAccount, purely so this workload's SPIFFE ID
# names it. SPIRE's ID template is
# spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}
# (deploy/platform/spire/registration.yaml), so without this the pod attests as
# `spiffe://northstar.local/ns/northstar-agents/sa/default` -- measured, not
# hypothetical: that is the ID SPIRE actually minted for this pod before this
# ServiceAccount existed. An identity whose service-account component reads
# "default" is not something a policy can decide on. It grants no RBAC; this
# pod makes no Kubernetes API calls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: settlement-agent
  namespace: northstar-agents
  labels:
    app: settlement-agent
    northstar.io/plane: agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-agent
  namespace: northstar-agents
  labels:
    app: settlement-agent
    northstar.io/plane: agents
    northstar.io/owner: claims-team
    # M6 Task 2: read by @backstage/plugin-kubernetes-backend's default
    # label selector (`backstage.io/kubernetes-id=<entity name>`), so this
    # Component's catalog entry (agents/settlement-agent/catalog-info.yaml)
    # shows its live workload. Added to the Pod template below too -- the
    # plugin queries Pods, not just Deployments. Deliberately NOT added to
    # senior-settlement-agent's own Deployment (deploy/k8s/
    # senior-settlement-agent.yaml): that identity has no catalog entry of
    # its own (this file's catalog-info.yaml says why), so labelling it here
    # would make it show up under a Component it is not.
    backstage.io/kubernetes-id: settlement-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-agent
  template:
    metadata:
      labels:
        app: settlement-agent
        northstar.io/plane: agents
        northstar.io/owner: claims-team
        backstage.io/kubernetes-id: settlement-agent
    spec:
      serviceAccountName: settlement-agent
      containers:
        - name: settlement-agent
          image: localhost:5001/northstar/settlement-agent:dev
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: settlement-agent
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # opentelemetry-instrumentation-httpx==0.65b0 emits the legacy HTTP
            # attribute spelling (http.method, http.url, http.status_code) by
            # default; this opt-in converges the outbound calls this agent
            # makes to payments-mcp onto the stable spelling (A13). Verified
            # empirically — see NOTES.md.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            # M2.1 Task 3: interposed. This pointed straight at
            # payments-mcp.northstar-tools.svc.cluster.local:8000/mcp through
            # M1.1, M1.2 and M2.1 Task 2 (which deployed the gateway but
            # deliberately left it out of the path). It now names agentgateway
            # in northstar-platform, which proxies to that same payments-mcp
            # Service -- the gateway's own
            # `deploy/platform/agentgateway/config.yaml` carries the old value
            # verbatim as its single MCP backend target, so the wire
            # destination is unchanged; only the number of hops is.
            #
            # Port 3000 and path /mcp are the gateway's, not payments-mcp's:
            # read off `deploy/platform/agentgateway/deployment.yaml`'s Service
            # (port 3000, targetPort 3000) and that config's `binds[0].port`
            # (3000), with /mcp being agentgateway's streamable-HTTP MCP
            # endpoint.
            #
            # The trace survives this hop -- `tests/e2e/test_gateway_trace.py`
            # is what actually proves it, and that file's module docstring
            # records *why*: an HTTP `traceparent` header injected by
            # HTTPXClientInstrumentor, which is a different carrier from this
            # repo's SEP-414 `params._meta` convention. agentgateway reads only
            # the header.
            - name: PAYMENTS_MCP_URL
              value: http://agentgateway.northstar-platform.svc.cluster.local:3000/mcp
            - name: AGENT_CARD_PATH
              value: /app/agent-card.json
            - name: PORT
              value: "9002"
            # M1.2: the settlement decision is a real model call. settlement.py
            # reads this variable (falling back to the same literal) and hands
            # it straight to PydanticAI's Agent.
            - name: NORTHSTAR_SETTLEMENT_MODEL
              value: "anthropic:claude-sonnet-5"
            # M1.2 Task 5: prompt/completion capture is configuration, not a
            # hardcoded constant. bootstrap.capture_content_enabled() reads
            # this (defaulting to ON if unset) and hands it straight to
            # PydanticAI's InstrumentationSettings(include_content=...). See
            # docs/telemetry-contract.md's "Content capture" section for why
            # the default is ON, not OFF.
            - name: NORTHSTAR_CAPTURE_CONTENT
              value: "true"
            # M2.1 Task 4: the SPIFFE Workload API endpoint svid.py talks to.
            #
            # `SPIFFE_ENDPOINT_SOCKET` is not this repo's invention -- it is the
            # variable the pinned `spiffe==0.3.1` client reads when no
            # socket_path is passed (`spiffe/config.py`:
            # `_SPIFFE_ENDPOINT_SOCKET = 'SPIFFE_ENDPOINT_SOCKET'`). svid.py
            # passes it explicitly anyway, so the value is visible here rather
            # than depending on library defaulting.
            #
            # The path is READ from the chart's rendered output, not assumed:
            # `helm template spire spiffe/spire --version 0.30.2` renders the
            # spiffe-oidc-discovery-provider -- the chart's OWN Workload API
            # consumer -- with `workload_api.socket_path:
            # /spiffe-workload-api/spire-agent.sock`, a volumeMount at
            # `mountPath: /spiffe-workload-api`, and a `csi.spiffe.io` volume.
            # The directory half is chosen by whoever mounts the CSI volume
            # (below), the `spire-agent.sock` filename is the driver's; this
            # matches the chart's own convention so there is one path in the
            # cluster, not two.
            #
            # Do NOT confuse this with the chart's
            # `upstream-spire-agent.socketPath`
            # (/run/spire/agent-sockets-upstream/spire-agent.sock) or
            # `spire-agent.socketPath`
            # (/run/spire/agent-sockets/spire-agent.sock): the first belongs to
            # nested mode, which this install does not use, and the second is
            # the HOST path the CSI driver reads from, not a path any workload
            # container can see.
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
            # The audience every JWT-SVID this agent mints is scoped to. It is
            # agentgateway's own registered SPIFFE ID (see
            # deploy/platform/spire/registration.yaml), which is also what
            # `deploy/platform/agentgateway/config.yaml`'s jwtAuth `audiences`
            # list carries -- one string, two ends of the same check. A token
            # minted for this audience is useless anywhere else, which is the
            # whole point of scoping it.
            - name: NORTHSTAR_GATEWAY_AUDIENCE
              value: spiffe://northstar.local/ns/northstar-platform/sa/agentgateway
            # Created by scripts/setup-kind.sh from the sourced .env.
            # `optional: true` deliberately, matching how the repo treats its
            # other degradable secret (dash0-secrets): with no key present the
            # pod still starts, stays traced and serves its agent card — only
            # the model call itself fails, with a credential error the logs
            # name. A required secretKeyRef would instead hold the pod in
            # CreateContainerConfigError, which reads as a broken deployment
            # rather than a missing credential.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: northstar-model
                  key: ANTHROPIC_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 9002
          # S6 (final-review.md): see claims-agent.yaml for the same fix and
          # reasoning — this endpoint is read from disk at build_app() time.
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9002
            initialDelaySeconds: 2
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        # The SPIFFE CSI driver, installed by the `spiffe/spire` 0.30.2 chart
        # (`spiffe-csi-driver.enabled`, default true). It bind-mounts the
        # spire-agent's Workload API socket into this pod, so the agent's
        # kubelet-based workload attestor can identify the calling container
        # -- which is what makes the SVID this pod receives an attested
        # identity rather than a shared secret. There is no token, key or
        # credential in this pod spec.
        #
        # `driver: csi.spiffe.io` is the plugin name the chart registers (read
        # from the rendered CSIDriver object, `name: "csi.spiffe.io"`); the
        # upstream/nested variant registers `upstream.csi.spiffe.io` instead
        # and is not installed here.
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-agent
  namespace: northstar-agents
spec:
  selector:
    app: settlement-agent
  ports:
    - name: http
      port: 9002
      targetPort: 9002

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: northstar-systems
  labels:
    app: payments-api
    northstar.io/plane: systems
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        northstar.io/plane: systems
    spec:
      containers:
        - name: payments-api
          image: localhost:5001/northstar/payments-api:dev
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: payments-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: northstar-systems
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080

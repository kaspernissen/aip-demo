# A dedicated ServiceAccount, so Linkerd can tell this workload from its
# neighbours. A meshed pod's identity is
# `<serviceaccount>.<namespace>.serviceaccount.identity.linkerd.cluster.local`
# (deploy/platform/reach/linkerd-policies.yaml authorizes callers by it). Pods
# that name no account share `default` in `northstar-tools`, so a policy naming
# it would admit them all. The account grants no RBAC; this pod makes no
# Kubernetes API calls. SPIRE's catch-all fallback
# (deploy/platform/spire/registration.yaml) gives it the SPIFFE ID
# `.../sa/payments-mcp`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-mcp
  namespace: northstar-tools
  labels:
    app: payments-mcp
    northstar.io/plane: tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-mcp
  namespace: northstar-tools
  labels:
    app: payments-mcp
    northstar.io/plane: tools
    # Read by @backstage/plugin-kubernetes-backend's default label selector
    # (`backstage.io/kubernetes-id=<entity name>`), so this Component's
    # catalog entry (tools/payments-mcp/catalog-info.yaml) shows its live
    # workload. Set on the Pod template below too -- the plugin queries
    # Pods, not just Deployments.
    backstage.io/kubernetes-id: payments-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-mcp
  template:
    metadata:
      labels:
        app: payments-mcp
        northstar.io/plane: tools
        backstage.io/kubernetes-id: payments-mcp
    spec:
      serviceAccountName: payments-mcp
      containers:
        - name: payments-mcp
          image: localhost:5001/northstar/payments-mcp:dev
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: payments-mcp
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # Default is 'native'. Set explicitly so a future upstream default
            # change cannot silently suppress MCP spans. Verified against the
            # installed fastmcp==4.0.3 — see NOTES.md.
            - name: FASTMCP_TELEMETRY_MODE
              value: native
            # opentelemetry-instrumentation-httpx==0.50b0 emits the legacy HTTP
            # attribute spelling (http.method, http.url, http.status_code) by
            # default; this opt-in converges outbound calls to payments-api on
            # the stable spelling payments-api itself emits. Verified
            # empirically — see NOTES.md.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            - name: PAYMENTS_API_URL
              value: http://payments-api.northstar-systems.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8000
          # See claims-agent.yaml for why every component here carries a
          # readiness probe. FastMCP's streamable-HTTP endpoint expects MCP
          # protocol framing on every request (a bare GET/HEAD is not a
          # meaningful health check), so this uses a TCP-connect probe
          # rather than httpGet — good enough to confirm the process is
          # actually listening, which is what rollout status and the sleep
          # 4 in setup-kind.sh assume with no check at all.
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 2
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-mcp
  namespace: northstar-tools
spec:
  selector:
    app: payments-mcp
  ports:
    - name: http
      port: 8000
      targetPort: 8000

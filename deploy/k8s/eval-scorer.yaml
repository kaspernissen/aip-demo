# M4 Task 4: eval-scorer, the component that turns "the audit trail exists"
# (Tasks 1-3) into "the audit trail has been checked".
#
# It reads a settlement's whole trajectory back out of OpenSearch, scores the
# five policy-adherence properties spec §5 names, and emits each score as an
# OTel span attached to the trace it judges -- so the judgment lands in the
# same index, beside the evidence, and the optional Dash0 export receives it
# at no extra cost.
#
# It lives in `northstar-platform`, with the gateway, SPIRE and the PDS,
# rather than in `northstar-tools` or beside the agents. Same reasoning
# deploy/k8s/policy-decision-service.yaml states for itself: it is platform
# machinery, not a tool an agent may call and not an agent's own dependency.
# No agent knows this exists, and nothing in the request path waits on it --
# which is the point, since an auditor that can stop a payment is not an
# auditor.
#
# **Stage 4 only.** It reads `ss4o_traces-default-namespace`, which does not
# exist below stage 4, so scripts/setup-kind.sh deploys it inside the
# `STAGE -ge 4` block. Against a stage-1 cluster a bare
# `./scripts/rebuild-and-deploy.sh` would fail applying this manifest on the
# missing `northstar-platform` namespace, exactly as
# policy-decision-service's would -- that script has no notion of stages and
# never has.
---
# A dedicated ServiceAccount, for the reason every other workload in this repo
# has one: SPIRE's ID template is
# spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}
# (deploy/platform/spire/registration.yaml), so a pod running as `default`
# attests as `spiffe://northstar.local/ns/northstar-platform/sa/default` -- an
# identity that verifies perfectly and identifies nothing. Measured in M2.1 on
# this cluster, for settlement-agent, before it was given one.
#
# Registered, but NOT fetched -- the same relationship
# policy-decision-service has with its own identity. This pod carries no
# Workload API mount: it calls nothing that checks a credential (OpenSearch on
# this cluster runs with the security plugin off, and the collector's OTLP
# endpoint is unauthenticated), so an SVID it never presents would be
# reachability nothing measured asked for. The identity exists so that when
# something does check one, the answer is this workload's own name.
#
# Its SPIFFE ID is in
# tests/unit/test_stage2_spire_config.py::EVAL_SCORER_SPIFFE_ID -- ruling R22,
# standing: adding a workload means adding its ID to that allow-list in the
# same task, never substituting a placeholder to keep the guard green.
#
# **And it needs a ClusterSPIFFEID of its own**, in
# deploy/platform/spire/registration.yaml, which this task added as the fourth.
# This comment said the opposite -- "none is needed: like reviewer-ui and
# senior-settlement-agent it takes its ID from the SPIRE chart's catch-all
# `default` CR" -- and that was inferred from the two nearest precedents rather
# than measured. Those two are in `northstar-agents`; the catch-all CR's
# namespaceSelector excludes `northstar-platform` by name, so this pod had a
# ServiceAccount, an allow-listed ID string and no SPIRE entry whatsoever
# (`spire-server entry show`: twelve entries, none of them its). Namespace
# decides, not the ServiceAccount.
#
# Grants no RBAC. This pod makes no Kubernetes API calls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-scorer
  namespace: northstar-platform
  labels:
    app: eval-scorer
    northstar.io/plane: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-scorer
  namespace: northstar-platform
  labels:
    app: eval-scorer
    northstar.io/plane: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-scorer
  template:
    metadata:
      labels:
        app: eval-scorer
        northstar.io/plane: platform
    spec:
      serviceAccountName: eval-scorer
      containers:
        - name: eval-scorer
          # scripts/rebuild-and-deploy.sh's convention:
          # localhost:5001/northstar/<component>:dev, built from
          # platform/eval-scorer and pushed to the kind registry.
          # `Always` because the tag never changes -- a rebuilt `:dev` would
          # otherwise be ignored in favour of the node's cached layer.
          image: localhost:5001/northstar/eval-scorer:dev
          imagePullPolicy: Always
          env:
            # The same three OTLP variables every other service here sets, so
            # the `evaluation <name>` spans reach the same collector and land
            # in the same index as the spans they judge. scorer/emit.py reads
            # them through the standard `OTEL_EXPORTER_OTLP_*` names rather
            # than any of our own, so this manifest is the only place they are
            # named.
            - name: OTEL_SERVICE_NAME
              value: eval-scorer
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # Where the trajectories are read from. The chart's own Service
            # name, in the namespace M4 Task 1 installed it into; the index
            # name is scorer/opensearch.py's, not this manifest's, because it
            # is a measured fact about the collector's exporter rather than a
            # deployment choice.
            - name: NORTHSTAR_OPENSEARCH_URL
              value: http://opensearch-cluster-master.observability.svc.cluster.local:9200
          # No OTEL_SEMCONV_STABILITY_OPT_IN here, unlike the three services
          # that set it: that opt-in converges *HTTP client* instrumentation
          # on the stable attribute spelling, and this service installs no
          # instrumentation library at all -- its only outbound calls are a
          # plain `urllib` request to OpenSearch and the exporter's own, and
          # neither is instrumented. Setting it would be cargo-culted from a
          # sibling manifest rather than doing anything.
          ports:
            - name: http
              containerPort: 8300
          # `/healthz` is a real route on the real server (scorer/server.py),
          # so this proves the HTTP server is up and routing -- more than the
          # TCP-socket probe policy-decision-service uses, which is what that
          # service settled for because a gRPC health check would have needed
          # a dependency outside its pinned closure.
          #
          # It deliberately does NOT probe OpenSearch. A readiness probe that
          # went red when the store was unreachable would take this pod out of
          # service for a condition it reports honestly as a 502 -- and unlike
          # the PDS, nothing here is fail-closed: no payment waits on this
          # pod, so there is no failure mode where a NotReady auditor becomes
          # "every payment refused".
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8300
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8300
            initialDelaySeconds: 5
            periodSeconds: 10
          # Matched to policy-decision-service's values, which are themselves
          # payments-mcp's measurement reused: a CPython 3.13 service whose
          # footprint is interpreter plus the OTel SDK. This service's own
          # closure is larger (the scoring SDK brings botocore and a second
          # OTLP exporter), so the limit is raised to 256Mi rather than
          # copied; the request is not, because idle RSS is what a request
          # describes and nothing here holds data between requests. No
          # independent measurement of this pod's idle RSS is published --
          # these are a sibling's numbers with one deliberate adjustment, not
          # this pod's own.
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eval-scorer
  namespace: northstar-platform
spec:
  selector:
    app: eval-scorer
  ports:
    - name: http
      port: 8300
      targetPort: 8300

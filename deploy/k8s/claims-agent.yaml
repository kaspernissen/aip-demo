apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-agent
  namespace: northstar-agents
  labels:
    app: claims-agent
    northstar.io/plane: agents
    northstar.io/owner: claims-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-agent
  template:
    metadata:
      labels:
        app: claims-agent
        northstar.io/plane: agents
        northstar.io/owner: claims-team
    spec:
      containers:
        - name: claims-agent
          image: localhost:5001/northstar/claims-agent:dev
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: claims-agent
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # opentelemetry-instrumentation-httpx==0.65b0 emits the legacy HTTP
            # attribute spelling (http.method, http.url, http.status_code) by
            # default; this opt-in converges the outbound A2A call this agent
            # makes to settlement-agent, and the inbound StarletteInstrumentor
            # entry span, onto the stable spelling (A13). Verified empirically
            # against this agent's own deployed pod — see NOTES.md.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            # Delegation is configured, never discovered. M2 replaces these with
            # agentgateway routes; M6 generates them from the Agent CRD.
            - name: NORTHSTAR_ALLOWED_AGENTS
              value: settlement-agent=http://settlement-agent.northstar-agents.svc.cluster.local:9002
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:8080
            - name: AGENT_CARD_PATH
              value: /app/agent-card.json
            - name: PORT
              value: "9001"
          ports:
            - name: http
              containerPort: 9001
          # S6 (final-review.md): only payments-api had a readiness probe.
          # rollout status (rebuild-and-deploy.sh) and the sleep 4 before
          # port-forwards start (setup-kind.sh) both treat "container process
          # started" as "ready to serve" for the other four components,
          # which can produce an unreproducible early-request failure on a
          # slow container start. The agent card is read from disk and
          # parsed at build_app() time (main.py) before the app can serve
          # anything, so a 200 here means startup genuinely finished.
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9001
            initialDelaySeconds: 2
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: claims-agent
  namespace: northstar-agents
spec:
  selector:
    app: claims-agent
  ports:
    - name: http
      port: 9001
      targetPort: 9001

# A dedicated ServiceAccount (M12), so Linkerd can tell this workload from its
# neighbours. A meshed pod's identity is
# `<serviceaccount>.<namespace>.serviceaccount.identity.linkerd.cluster.local`
# (deploy/platform/reach/linkerd-policies.yaml authorizes callers by it), and
# until now this pod ran as `default`, which every other pod in `northstar-agents` that
# names no account shares: a policy naming it would admit them all. It grants no
# RBAC; this pod makes no Kubernetes API calls. No named ClusterSPIFFEID selects
# this workload, but SPIRE's catch-all fallback does
# (deploy/platform/spire/registration.yaml), so its SPIFFE ID DOES change with this
# account: from `.../sa/default` to `.../sa/claims-agent`. Nothing in the repo
# references the old ID.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-agent
  namespace: northstar-agents
  labels:
    app: claims-agent
    northstar.io/plane: agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-agent
  namespace: northstar-agents
  labels:
    app: claims-agent
    northstar.io/plane: agents
    northstar.io/owner: claims-team
    # Read by @backstage/plugin-kubernetes-backend's default label selector
    # (`backstage.io/kubernetes-id=<entity name>`), so this Component's
    # catalog entry (agents/claims-agent/catalog-info.yaml) shows its live
    # workload. Set on the Pod template below too -- the plugin queries
    # Pods, not just Deployments.
    backstage.io/kubernetes-id: claims-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-agent
  template:
    metadata:
      labels:
        app: claims-agent
        northstar.io/plane: agents
        northstar.io/owner: claims-team
        backstage.io/kubernetes-id: claims-agent
    spec:
      serviceAccountName: claims-agent
      containers:
        - name: claims-agent
          image: localhost:5001/northstar/claims-agent:dev
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: claims-agent
            # Exact-match allowlist of A2A push URLs (push.py); anything else is refused.
            - name: CLAIMS_AGENT_PUSH_URL_ALLOWLIST
              value: http://customer-ui.northstar-agents.svc.cluster.local:8080/a2a/push
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # opentelemetry-instrumentation-httpx==0.65b0 emits the legacy HTTP
            # attribute spelling (http.method, http.url, http.status_code) by
            # default; this opt-in converges the outbound A2A call this agent
            # makes to settlement-agent, and the inbound StarletteInstrumentor
            # entry span, onto the stable spelling. Verified empirically
            # against this agent's own deployed pod — see NOTES.md.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            # Delegation is configured explicitly here, never discovered at
            # runtime.
            - name: NORTHSTAR_ALLOWED_AGENTS
              value: settlement-agent=http://settlement-agent.northstar-agents.svc.cluster.local:9002
            # The one read of the ledger, when a waiting task is resumed
            # (ledger.py). GET /payments/{id} only; moves no money.
            - name: PAYMENTS_API_URL
              value: http://payments-api.northstar-systems.svc.cluster.local:8080
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:8080
            - name: AGENT_CARD_PATH
              value: /app/agent-card.json
            - name: PORT
              value: "9001"
            # The intake model: a claim that arrives as free text, not as a
            # JSON object, is read into a draft by this model (extraction.py
            # reads this variable, with the same literal as its default). A
            # JSON claim never reaches it.
            - name: NORTHSTAR_CLAIMS_MODEL
              value: "anthropic:claude-sonnet-5"
            # Prompt/completion capture, as on settlement-agent: bootstrap.py
            # reads this (ON if unset). With it on, the intake's chat span
            # carries the customer's own description of the claim. See
            # docs/telemetry-contract.md, "Content capture".
            - name: NORTHSTAR_CAPTURE_CONTENT
              value: "true"
            # The same Secret settlement-agent reads, created by
            # scripts/setup-kind.sh from .env. Optional for the same reason:
            # with no key the pod starts and JSON claims work; only a free-text
            # claim fails, on the task, with the credential error in `error`.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: northstar-model
                  key: ANTHROPIC_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 9001
          # Without this, rollout status (rebuild-and-deploy.sh) and the
          # sleep 4 before port-forwards start (setup-kind.sh) both treat
          # "container process started" as "ready to serve", which can
          # produce an unreproducible early-request failure on a slow
          # container start. The agent card is read from disk and parsed at
          # build_app() time (main.py) before the app can serve anything, so
          # a 200 here means startup genuinely finished.
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9001
            initialDelaySeconds: 2
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: claims-agent
  namespace: northstar-agents
spec:
  selector:
    app: claims-agent
  ports:
    - name: http
      port: 9001
      targetPort: 9001

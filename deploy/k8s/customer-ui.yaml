# A dedicated ServiceAccount (M12), so Linkerd can tell this workload from its
# neighbours. A meshed pod's identity is
# `<serviceaccount>.<namespace>.serviceaccount.identity.linkerd.cluster.local`
# (deploy/platform/reach/linkerd-policies.yaml authorizes callers by it), and
# until now this pod ran as `default`, which every other pod in `northstar-agents` that
# names no account shares: a policy naming it would admit them all. It grants no
# RBAC; this pod makes no Kubernetes API calls. No SPIRE ClusterSPIFFEID selects
# this workload (deploy/platform/spire/registration.yaml), so no SPIFFE ID
# changes with this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-ui
  namespace: northstar-agents
  labels:
    app: customer-ui
    northstar.io/plane: agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-ui
  namespace: northstar-agents
  labels:
    app: customer-ui
    # Every workload in northstar-agents carries northstar.io/plane, including
    # customer-ui, so each component's platform configuration lives in
    # exactly one consistent place rather than being inferred per-workload.
    northstar.io/plane: agents
    # Read by @backstage/plugin-kubernetes-backend's default label selector
    # (`backstage.io/kubernetes-id=<entity name>`), so this Component's
    # catalog entry (apps/customer-ui/catalog-info.yaml) shows its live
    # workload. Set on the Pod template below too -- the plugin queries
    # Pods, not just Deployments.
    backstage.io/kubernetes-id: customer-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-ui
  template:
    metadata:
      labels:
        app: customer-ui
        northstar.io/plane: agents
        backstage.io/kubernetes-id: customer-ui
    spec:
      serviceAccountName: customer-ui
      containers:
        - name: customer-ui
          # Images go through the local registry, never `kind load`.
          image: localhost:5001/northstar/customer-ui:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: customer-ui-server
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # The only push URL the claims-agent accepts (an exact-match
            # allowlist there); the browser is handed it by /claims/push-config.
            - name: CUSTOMER_UI_PUSH_URL
              value: http://customer-ui.northstar-agents.svc.cluster.local:8080/a2a/push
          # See claims-agent.yaml for why every component here carries a
          # readiness probe. The Starlette server answers /healthz once it is
          # up; it also serves the built static export.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-ui
  namespace: northstar-agents
spec:
  type: NodePort
  selector:
    app: customer-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

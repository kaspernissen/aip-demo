apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-ui
  namespace: northstar-agents
  labels:
    app: customer-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-ui
  template:
    metadata:
      labels:
        app: customer-ui
    spec:
      containers:
        - name: customer-ui
          # A1: images go through the local registry, never `kind load`.
          image: localhost:5001/northstar/customer-ui:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-ui
  namespace: northstar-agents
spec:
  type: NodePort
  selector:
    app: customer-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

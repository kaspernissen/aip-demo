apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-ui
  namespace: northstar-agents
  labels:
    app: customer-ui
    # N9 (final-review.md): claims-agent/settlement-agent both carry
    # northstar.io/plane, and customer-ui deploys into the same
    # northstar-agents namespace but had been left out — spec §2 wants each
    # component's platform configuration in exactly one consistent place so
    # M6 is a collapse rather than a rewrite, which needs this label present
    # everywhere from M1 onward, not just on the two agents that happened to
    # add it first.
    northstar.io/plane: agents
    # M6 Task 2: read by @backstage/plugin-kubernetes-backend's default
    # label selector (`backstage.io/kubernetes-id=<entity name>`), so this
    # Component's catalog entry (apps/customer-ui/catalog-info.yaml) shows
    # its live workload. Added to the Pod template below too -- the plugin
    # queries Pods, not just Deployments.
    backstage.io/kubernetes-id: customer-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-ui
  template:
    metadata:
      labels:
        app: customer-ui
        northstar.io/plane: agents
        backstage.io/kubernetes-id: customer-ui
    spec:
      containers:
        - name: customer-ui
          # A1: images go through the local registry, never `kind load`.
          image: localhost:5001/northstar/customer-ui:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # S6 (final-review.md): see claims-agent.yaml for the general fix.
          # nginx serves the built static export, so a 200 on / means the
          # container is actually ready to serve.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-ui
  namespace: northstar-agents
spec:
  type: NodePort
  selector:
    app: customer-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

# Stage 2 (Governed) kind cluster. Since M12 it is structurally identical to
# stage1.yaml: kind's default CNI (kindnet) stays, because kindnet (kind >=
# 0.24, kube-network-policies) enforces core NetworkPolicy, and Linkerd meshes
# the app namespaces on top of it. Until M12 this file set
# `networking.disableDefaultCNI: true` so Cilium could own the dataplane; that
# flag is create-time, so a cluster built from the old file cannot be reused
# (scripts/setup-kind.sh refuses it and says to delete and recreate).
#
# The file is kept, rather than letting stage 2 reuse stage1.yaml, so each
# stage still selects its own kind config by name and tests/unit pin that.
#
# Deliberately NOT set here:
#   - `podSubnet`: left at kind's default 10.244.0.0/16.
#   - `kubeProxyMode`: kube-proxy stays in place.
#
# Everything below (containerdConfigPatches for the shared `kind-registry`, and
# all three extraPortMappings) is byte-for-byte stage1.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: northstar
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # customer-ui
        hostPort: 8080
        protocol: TCP
      - containerPort: 30686   # jaeger query UI
        hostPort: 16686
        protocol: TCP
      - containerPort: 30318   # collector OTLP/HTTP, for tests running on the host
        hostPort: 4318
        protocol: TCP

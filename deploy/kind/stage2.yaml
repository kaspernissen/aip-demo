# Stage 2 (Governed) kind cluster: identical to stage1.yaml except that the
# default CNI is disabled so Cilium can own the dataplane.
#
# WHY THIS IS A SEPARATE FILE, AND MUST NOT BE MERGED BACK INTO stage1.yaml:
# `networking.disableDefaultCNI` is a **create-time** kind flag. kind writes it
# into the node's kubeadm/CNI bootstrap when the container is created, so it
# cannot be flipped on a running cluster -- switching to Cilium therefore
# requires deleting and recreating `northstar`. Stage 1 must keep its default
# CNI (kindnet) so stage 1 remains bring-up-able on its own without Cilium.
#
# Deliberately NOT set here:
#   - `podSubnet`: left at kind's default 10.244.0.0/16. Cilium runs with
#     `ipam.mode: kubernetes` (deploy/platform/cilium-values.yaml), which
#     allocates from the node podCIDRs kind carves out of that default. Setting
#     a podSubnet here would have to be kept in sync with that by hand for no
#     gain.
#   - `kubeProxyMode`: kube-proxy stays in place. Cilium's kube-proxy
#     replacement is not required for this demo -- the M2 spec is explicit that
#     the DNS-aware egress denial in M2.2 is ordinary CiliumNetworkPolicy
#     (`toFQDNs`) and works with kube-proxy present -- and enabling it on kind
#     invites cgroup-v2 and kernel-version problems.
#
# Everything below (containerdConfigPatches for the shared `kind-registry`, and
# all three extraPortMappings) is byte-for-byte stage1.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: northstar
networking:
  disableDefaultCNI: true
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # customer-ui
        hostPort: 8080
        protocol: TCP
      - containerPort: 30686   # jaeger query UI
        hostPort: 16686
        protocol: TCP
      - containerPort: 30318   # collector OTLP/HTTP, for tests running on the host
        hostPort: 4318
        protocol: TCP

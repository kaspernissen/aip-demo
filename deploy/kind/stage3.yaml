# Stage 3 (Supervised) kind cluster: identical to stage2.yaml except for one
# extra host port mapping, for reviewer-ui.
#
# WHY THIS IS A SEPARATE FILE, AND MUST NOT BE MERGED BACK INTO stage2.yaml:
# `extraPortMappings` is only applied at cluster **creation** -- kind writes
# the container's published ports when the node container is created, so a
# new mapping cannot be added to a running cluster any more than
# `disableDefaultCNI` could (see stage2.yaml's own header for that half of the
# rule). Stage 2 must keep exactly its three mappings so it remains
# bring-up-able on its own without reviewer-ui's port ever being reserved.
#
# WHAT STAGE 3 ACTUALLY DEPLOYS: stage 2, plus reviewer-ui (the approval page
# a human reads and clicks, reached on the host port reserved below) and
# senior-settlement-agent -- the SAME settlement-agent image in a second
# Deployment under a second ServiceAccount, because "senior" here is an
# identity, not a different program. `scripts/setup-kind.sh`'s Step 9d/9 is
# what installs both. payments-api's refusal record and the PDS's senior row
# are M3 code rather than M3 workloads, so they arrive inside stage 2's own
# images.
#
# **Correction, M3 final-review fix round 2026-09-11.** This paragraph read:
#
#   WHAT STAGE 3 ACTUALLY DEPLOYS, RIGHT NOW: at M3 Task 1 nothing else
#   exists yet. This file's only difference from stage2.yaml is the host port
#   reserved below for reviewer-ui -- stage 3 currently deploys exactly what
#   stage 2 deploys, plus that free port. Later M3 tasks (2-5) add the
#   workloads (payments-api's refusal record, the senior-settlement-agent
#   identity, the PDS's new row, and reviewer-ui itself) that make stage 3 a
#   materially different cluster from stage 2. Until then, treat "stage 3" as
#   "stage 2, with the port reserved".
#
# True at M3 Task 1, false from Task 4 onward -- and the same sentence, in
# `scripts/setup-kind.sh`'s `--stage 3` help text, was corrected for exactly
# this reason in commit 9c7b3b7 ("This paragraph read 'no M3 workload exists
# yet' from M3 Task 1 until Task 5B; that was true when written and false
# from Task 4 onward"). That fix missed this copy, which is why the M3 final
# review found it: the doc pass covered README.md, docs/ and the contracts,
# and not the manifest headers or kind-config comments. Following the old
# text, an operator would bring up stage 3 and then expect no reviewer-ui on
# 8081 -- the exact workload `scripts/smoke-test.sh`'s prerequisite loop
# requires before the gate will run at all.
#
# Deliberately NOT set here: same two omissions as stage2.yaml (`podSubnet`,
# `kubeProxyMode`), for the same reasons -- see that file's header.
#
# Everything below (containerdConfigPatches for the shared `kind-registry`,
# `disableDefaultCNI`, and the three stage1/stage2 extraPortMappings) is
# byte-for-byte stage2.yaml, plus the one new mapping for reviewer-ui.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: northstar
networking:
  disableDefaultCNI: true
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # customer-ui
        hostPort: 8080
        protocol: TCP
      - containerPort: 30686   # jaeger query UI
        hostPort: 16686
        protocol: TCP
      - containerPort: 30318   # collector OTLP/HTTP, for tests running on the host
        hostPort: 4318
        protocol: TCP
      - containerPort: 30081   # reviewer-ui
        hostPort: 8081
        protocol: TCP

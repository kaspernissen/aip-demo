# M6 Task 2: this component's software-catalog entry. Staging/build-context
# note lives in the top-level catalog-info.yaml -- read that once, not once
# per component.
#
# No entry in contracts/agent-cards/ -- the PDS is platform machinery, not an
# A2A agent, so there is nothing here to link (design's own rule: "where one
# exists"). It is still the one thing this milestone's whole design insists
# on: "the PDS is still the only decision point" (design §4) -- Backstage's
# Task 3 card can edit the `northstar-autonomy` FeatureFlag the PDS reads,
# but never bypasses the PDS itself.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: policy-decision-service
  description: >-
    The one decision point in the system: reads the `northstar-autonomy`
    FeatureFlag contract and decides whether a settlement requires human
    review or may execute autonomously.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: policy-decision-service
    backstage.io/kubernetes-namespace: northstar-platform
  tags:
    - platform
    - policy
    - security
  links:
    # Absolute, not the relative `/autonomy-contract` this first carried.
    # Backstage's entity policy requires `links[].url` to be a valid URL and
    # rejects a bare path -- and the rejection drops the WHOLE entity from the
    # catalog, not just the link: policy-decision-service vanished from the
    # component list while the backend logged a single `warn` and the pod
    # stayed Ready. tests/unit/test_catalog_links_are_absolute_urls.py is the
    # detector, because the running system's own signal for this is a page
    # that is quietly missing something.
    - url: http://localhost:7007/autonomy-contract
      title: Autonomy contract
      icon: dashboard
    - url: "http://localhost:16686/search?service=policy-decision-service&lookback=1h&limit=50"
      title: Traces in Jaeger (last hour)
      icon: dashboard
    - url: "http://localhost:5601/app/data-explorer/discover#?_g=(time:(from:now-1h,to:now))&_a=(discover:(columns:!(resource.service.name,name,durationInNanos),sort:!()),metadata:(indexPattern:'northstar-evidence-traces',view:discover))&_q=(filters:!(),query:(language:kuery,query:'resource.service.name:%22policy-decision-service%22'))"
      title: Decision spans in OpenSearch
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: northstar
  dependsOn:
    - resource:northstar-autonomy

---
# The autonomy contract itself, as a catalog entity.
#
# Added 2026-09-16 because a reader looking at the component list asked where
# OpenFeature was, and the honest answer was: nowhere. flagd ran as a native
# sidecar in this service's pod, the `northstar-autonomy` FeatureFlag was the
# thing the demo's last beat flips, and the catalog -- the portal's own answer
# to "what is this system made of" -- did not mention either.
#
# `kind: Resource`, not Component: it is not built or deployed from a
# directory in this tree (which is also why the component guards in tests/unit
# do not demand an mkdocs.yml beside it -- they filter on Component). It is a
# FeatureFlag custom resource in the cluster, owned by the platform, that
# policy-decision-service reads at request time. The `dependsOn` above makes
# that edge show up on the PDS entity page and in the Catalog Graph, which is
# where someone tracing "who decided, and under what contract?" will look.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: northstar-autonomy
  description: >-
    The autonomy contract: an OpenFeature FeatureFlag, served by a flagd
    sidecar in the policy-decision-service pod, that decides whether a
    settlement may execute autonomously or must go to a human. Ships refusing
    -- `defaultVariant: assisted`, with both targeting branches also
    `assisted`.
  annotations:
    backstage.io/kubernetes-id: policy-decision-service
    backstage.io/kubernetes-namespace: northstar-platform
  tags:
    - openfeature
    - flagd
    - feature-flag
    - policy
    - autonomy
  links:
    - url: http://localhost:7007/autonomy-contract
      title: Read and flip the contract
      icon: dashboard
spec:
  type: feature-flag
  owner: guests
  system: northstar

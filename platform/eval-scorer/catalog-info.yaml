# M6 Task 2: this component's software-catalog entry. Staging/build-context
# note lives in the top-level catalog-info.yaml -- read that once, not once
# per component.
#
# No entry in contracts/agent-cards/ -- eval-scorer is platform machinery
# (the audit path), not an A2A agent, so there is nothing here to link
# (design's own rule: "where one exists").
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: eval-scorer
  description: >-
    Scores settlement decisions after the fact against the telemetry
    contract, for the audit trail M3/M4/M5 built.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: eval-scorer
    backstage.io/kubernetes-namespace: northstar-platform
  tags:
    - platform
    - evaluation
    - audit
  links:
    - url: "http://localhost:16686/search?service=eval-scorer&lookback=1h&limit=50"
      title: Traces in Jaeger (last hour)
      icon: dashboard
    - url: "http://localhost:5601/app/data-explorer/discover#?_g=(time:(from:now-1h,to:now))&_a=(discover:(columns:!(resource.service.name,name,durationInNanos),sort:!()),metadata:(indexPattern:'northstar-evidence-traces',view:discover))&_q=(filters:!(),query:(language:kuery,query:'resource.service.name:%22eval-scorer%22'))"
      title: Spans in OpenSearch
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: northstar
  dependsOn:
    - resource:opensearch

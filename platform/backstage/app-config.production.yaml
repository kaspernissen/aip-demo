app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # SQLite, not PostgreSQL (design §3, docs/superpowers/specs/
  # 2026-09-15-northstar-m6-golden-path-design.md). This cluster is torn down
  # and rebuilt, not operated; a second stateful component buys durability
  # nobody wants, a pod, a PVC and a failure mode on stage for a catalog that
  # is re-read from committed catalog-info.yaml files on every start anyway.
  # `:memory:` matches that property exactly: nothing here survives a restart
  # because nothing here is the source of truth -- the committed files are.
  # The scaffold's own default (`app-config.yaml`'s dev database) already used
  # the same client and connection string; this file only stops overriding it
  # with Postgres for the "production" build the in-cluster image runs under
  # NODE_ENV=production.
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  providers:
    # The in-cluster image runs under NODE_ENV=production (it is the
    # `yarn build` output), and Backstage's guest provider refuses to issue a
    # token outside development unless this flag is set:
    #
    #   POST /api/auth/guest/refresh -> 403
    #   "The guest provider cannot be used outside of a development environment"
    #
    # So without it the catalog exists, the backend collates it, and nobody can
    # see any of it -- which is the entire deliverable of this milestone.
    #
    # This is a deliberate, recorded choice, not a workaround. Design §10 already
    # states the posture plainly: **Backstage here is unauthenticated, and anyone
    # who can reach the port can lower the autonomy guardrail.** That is
    # acceptable for a laptop demo cluster reached only through an explicit
    # `kubectl port-forward` -- there is no Ingress, no LoadBalancer, and no node
    # port -- and it is NOT acceptable anywhere else. The talk says this out loud
    # rather than letting an audience assume otherwise.
    #
    # The thing that keeps this honest is the narrowness of what the UI can do,
    # not the login: Task 3's contract card gets its own ServiceAccount limited
    # to get/list/patch on `resourceNames: [northstar-autonomy]` with no delete,
    # separate from the read-only ServiceAccount the Kubernetes plugin uses.
    # Anyone reaching this port can flip the autonomy contract and nothing else.
    guest:
      dangerouslyAllowOutsideDevelopment: true

catalog:
  # Overrides the default list locations from app-config.yaml, which are
  # scaffold example data (design §3, docs/superpowers/specs/
  # 2026-09-15-northstar-m6-golden-path-design.md). Every location below is
  # `type: file`, resolved relative to this process's cwd (`/app` in the
  # container -- see the Dockerfile's `CMD`), and every target is baked into
  # the image at build time rather than fetched over a network: this repo
  # has no git remote, so a `type: url`/`type: github` location is not an
  # option, and design §3 makes that a deliberate property ("the catalog is
  # derived from the repo, not from a database somebody edited once") rather
  # than a workaround.
  #
  # The nine files below (the System plus the eight components) are staged
  # into ./catalog/... by scripts/rebuild-and-deploy.sh's backstage build
  # step and are NOT hand-maintained here as a list of names: each is
  # derived from the repo's own directory tree (that script's COMPONENTS
  # array), and tests/unit/test_catalog_matches_the_tree.py reddens if a
  # ninth component is added to that tree with no catalog-info.yaml of its
  # own. This locations list, by contrast, IS names written by hand -- a
  # Backstage `type: file` location has no glob/discovery mode -- so a
  # ninth component also needs one more line here, same as it needs one more
  # COMPONENTS entry in rebuild-and-deploy.sh already.
  locations:
    - type: file
      target: ./catalog/system-catalog-info.yaml

    - type: file
      target: ./catalog/agents/claims-agent/catalog-info.yaml
    - type: file
      target: ./catalog/agents/settlement-agent/catalog-info.yaml
    - type: file
      target: ./catalog/apps/customer-ui/catalog-info.yaml
    - type: file
      target: ./catalog/apps/reviewer-ui/catalog-info.yaml
    - type: file
      target: ./catalog/platform/eval-scorer/catalog-info.yaml
    - type: file
      target: ./catalog/platform/policy-decision-service/catalog-info.yaml
    - type: file
      target: ./catalog/systems/payments-api/catalog-info.yaml
    - type: file
      target: ./catalog/tools/payments-mcp/catalog-info.yaml

    # This app's own entry (platform/backstage/catalog-info.yaml, unchanged
    # scaffold default) -- not one of the eight, not baked into ./catalog
    # (it ships in the image root already, alongside app-config*.yaml).
    - type: file
      target: ./catalog-info.yaml

    # Local example organizational data: the only Group this demo defines
    # ("guests", examples/org.yaml) is every entry above's `owner`. No
    # scaffolder, no TechDocs, no real org integration (design §2, "Out") --
    # not worth inventing a second Group for a demo cluster.
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

techdocs:
  # Generate on demand, inside this pod, and serve from its own filesystem.
  #
  # `runIn: 'local'` rather than the scaffold's `'docker'`: there is no Docker
  # daemon inside this pod to shell out to, and mounting one would be a far
  # larger grant than a docs renderer warrants. The Dockerfile installs
  # python3 + mkdocs-techdocs-core so "local" has a generator to call.
  #
  # `publisher.type: 'local'` writes the generated site under the backend's
  # own working directory. Nothing here needs to survive a restart -- the
  # source of truth is the committed docs/ directory staged into the image,
  # exactly as it is for the catalog itself (design §3), so a rebuild is how
  # documentation changes reach this instance.
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

kubernetes:
  # M6 Task 2: wires the Kubernetes plugin (already registered in
  # packages/backend/src/index.ts and packages/app/src/App.tsx by this task)
  # to the SAME cluster Backstage's own pod runs in, using the READ-ONLY
  # ServiceAccount Task 1 already granted it (`backstage`, bound to the
  # `backstage-read-only` ClusterRole in deploy/k8s/backstage.yaml). Ruling
  # M6-R5: this is deliberately the only ServiceAccount the plugin gets --
  # Task 3's write grant is separate, narrower, and for the autonomy card
  # alone, not for this.
  #
  # `authProvider: serviceAccount` with no `serviceAccountToken` configured:
  # verified against the installed
  # @backstage/plugin-kubernetes-backend@0.21.7's ServiceAccountStrategy
  # (node_modules/@backstage/plugin-kubernetes-backend/dist/auth/
  # ServiceAccountStrategy.cjs.js) — with no token given, it calls the
  # `@kubernetes/client-node` KubeConfig's `loadFromCluster()`, which reads
  # this pod's own mounted `/var/run/secrets/kubernetes.io/serviceaccount/`
  # token and CA. No Secret reference belongs in this file for that reason:
  # there is nothing to put there that the in-cluster default does not
  # already provide, and design §4 is explicit that this ServiceAccount gets
  # no Secret access at all.
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: https://kubernetes.default.svc
          name: northstar-kind
          authProvider: serviceAccount
          skipTLSVerify: false
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # No metrics.k8s.io in this cluster (verified 2026-09-15,
          # `kubectl get apiservices` -- no such APIService; same finding
          # deploy/k8s/backstage.yaml's ClusterRole comment already records).
          # Without this the plugin retries a metrics lookup that can only
          # ever fail, on every entity, every poll.
          skipMetricsLookup: true

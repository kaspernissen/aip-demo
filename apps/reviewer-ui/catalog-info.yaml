    backstage.io/kubernetes-id: reviewer-ui
    backstage.io/kubernetes-namespace: northstar-agents
  tags:
    - frontend
    - python
    - fastapi
    - human-in-the-loop
  links:
    - url: http://localhost:8081
      title: Open the review console
      icon: web
    - url: http://localhost:16686/search?service=reviewer-ui
      title: Traces in Jaeger
      icon: dashboard
spec:
  type: website
  lifecycle: production
  owner: guests
  system: northstar

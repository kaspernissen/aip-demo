# This component's software-catalog entry. The staging/build-context note
# lives in the top-level catalog-info.yaml -- read that once, not once
# per component.
#
# No entry in contracts/agent-cards/ -- reviewer-ui is a UI, not an A2A
# agent, so there is nothing here to link.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: reviewer-ui
  description: >-
    The human-review surface: shows payments awaiting approval, releases an
    approved payment through agentgateway under its own identity, and records
    a rejection on the ledger.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: reviewer-ui
    backstage.io/kubernetes-namespace: northstar-agents
  tags:
    - frontend
    - fastapi
    - human-in-the-loop
  links:
    - url: http://localhost:8081
      title: Open the review console
      icon: web
    - url: "http://localhost:16686/search?service=reviewer-ui&lookback=1h&limit=50"
      title: Traces in Jaeger (last hour)
      icon: dashboard
    - url: "http://localhost:9090/graph?g0.expr=sum%20by%20%28server_address%29%20%28rate%28http_client_duration_milliseconds_count%7Bjob%3D%22reviewer-ui%22%7D%5B5m%5D%29%29&g0.tab=0&g0.stacked=0&g0.range_input=1h"
      title: Outbound call rate
      icon: dashboard
spec:
  type: website
  lifecycle: production
  owner: guests
  system: northstar
  dependsOn:
    - component:payments-api

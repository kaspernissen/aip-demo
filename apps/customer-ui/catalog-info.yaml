# M6 Task 2: this component's software-catalog entry. Staging/build-context
# note lives in the top-level catalog-info.yaml -- read that once, not once
# per component.
#
# No entry in contracts/agent-cards/ -- customer-ui is a UI, not an A2A
# agent, so there is nothing here to link (design's own rule: "where one
# exists").
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: customer-ui
  description: >-
    The customer-facing surface for filing a claim and watching it progress.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: customer-ui
    backstage.io/kubernetes-namespace: northstar-agents
  tags:
    - frontend
    - nextjs
    - customer-facing
  links:
    - url: http://localhost:8080
      title: Open the claim form
      icon: web
    - url: "http://localhost:16686/search?service=customer-ui&lookback=1h&limit=50"
      title: Traces in Jaeger (last hour)
      icon: dashboard
    - url: "http://localhost:5601/app/data-explorer/discover#?_g=(time:(from:now-1h,to:now))&_a=(discover:(columns:!(resource.service.name,name,durationInNanos),sort:!()),metadata:(indexPattern:'northstar-evidence-traces',view:discover))&_q=(filters:!(),query:(language:kuery,query:'resource.service.name:%22customer-ui%22'))"
      title: Spans in OpenSearch
      icon: dashboard
spec:
  type: website
  lifecycle: production
  owner: guests
  system: northstar
  dependsOn:
    - component:claims-agent
  consumesApis:
    - claims-agent-card

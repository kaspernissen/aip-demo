# Weaver live-check findings policy (M9). Read by the weaver-live-check pod in
# the observability namespace (deploy/observability/weaver-live-check.yaml); the
# flags are on that Deployment, this file holds what flags cannot.
#
# Why overrides rather than a clean registry-wide check: live-check judges every
# signal the collector copies to it, and most of that traffic is OpenTelemetry
# semantic conventions, Kyverno, Linkerd, SPIRE and agentgateway names that this
# repo does not own. Those must not fail the gate. The names we own, and the
# retired un-prefixed namespaces we must no longer emit, must.
#
# Overrides are FIRST MATCH WINS and globs have no negation, so the specific
# override comes first and the catch-all last (measured on weaver v0.28.0).

[live-check]
fail_on = "violation"

[live-check.otlp]
grpc_address = "0.0.0.0"
grpc_port = 4317
admin_port = 4320

# Names we own, plus the retired namespaces. The override matches on the name of
# the thing being judged: the attribute key for an attribute finding, the metric
# name for a metric one (measured live: a foreign attribute on an owned span stays
# `information`; a misspelled owned attribute on any span is a violation).
#
# The ids are the real ones from weaver v0.28.0. `undefined_enum_variant` is
# `information` by default; for our names an enum value outside the registry's set
# is a real defect, so it is raised. `missing_attribute`, `missing_namespace`,
# `not_stable` and `extends_namespace` are the findings a real report holds for
# foreign names; only the first is a violation for ours (everything we define is
# stability: development, so `not_stable` stays information).
#
# `required_attribute_not_present` is listed but NOT observed to fire: with the
# registry's `required` `northstar.policy.rule` dropped from the decision span
# (mutation, 2026-10-17), live-check v0.28.0 reported no finding at all. A missing
# required attribute is therefore not caught by this gate; see
# docs/telemetry-contract.md, "What live-check checks, and what it does not".
# Listed so that a weaver release that starts checking it is not silently
# lowered by the catch-all.
[[live-check.finding_level_overrides]]
ids = [
  "missing_attribute",
  "missing_metric",
  "missing_event",
  "type_mismatch",
  "undefined_enum_variant",
  "unit_mismatch",
  "unexpected_instrument",
  "kind_mismatch",
  "required_attribute_not_present",
]
level = "violation"
sample_names = ["northstar.*", "policy.*", "review.*", "claim.*", "settlement.*"]

# Everything else is information. Must stay last.
[[live-check.finding_level_overrides]]
level = "information"

# M6 Task 2: this component's software-catalog entry. Staging/build-context
# note lives in the top-level catalog-info.yaml -- read that once, not once
# per component.
#
# No entry in contracts/agent-cards/ -- payments-api is the system of record
# settlement-agent calls through payments-mcp, not an A2A agent itself, so
# there is nothing here to link (design's own rule: "where one exists").
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payments-api
  description: >-
    The system of record for payments: executes a settlement once
    settlement-agent (via payments-mcp) instructs it to.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: payments-api
    backstage.io/kubernetes-namespace: northstar-systems
  tags:
    - system-of-record
    - go
    - payments
  links:
    - url: "http://localhost:16686/search?service=payments-api&lookback=1h&limit=50"
      title: Traces in Jaeger (last hour)
      icon: dashboard
    - url: "http://localhost:5601/app/data-explorer/discover#?_g=(time:(from:now-1h,to:now))&_a=(discover:(columns:!(resource.service.name,name,durationInNanos),sort:!()),metadata:(indexPattern:'northstar-evidence-traces',view:discover))&_q=(filters:!(),query:(language:kuery,query:'resource.service.name:%22payments-api%22'))"
      title: Spans in OpenSearch
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: northstar

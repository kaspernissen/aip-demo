# This component's software-catalog entry. Staging/build-context
# note lives in the top-level catalog-info.yaml -- read that once, not once
# per component.
#
# The agent card is LINKED via the API entity below, not restated -- see
# agents/claims-agent/catalog-info.yaml's header comment for why it is a
# Component -> providesApis -> API graph edge and not an inlined `$text`
# placeholder (that route was tried first and is not supported by this
# Backstage version's default reader set for a local, git-less file).
#
# This is the only settlement Deployment; a human approval is released by the
# reviewer-ui, not by a second settlement agent.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: settlement-agent
  description: >-
    Proposes and executes settlements for motor claims, reading the
    `northstar-autonomy` FeatureFlag contract to decide whether a settlement
    executes assisted (human-reviewed) or autonomously.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: settlement-agent
    backstage.io/kubernetes-namespace: northstar-agents
  tags:
    - agent
    - llm
    - mcp
  links:
    - url: "http://localhost:16686/search?service=settlement-agent&lookback=1h&limit=50"
      title: Traces in Jaeger (last hour)
      icon: dashboard
    - url: "http://localhost:9090/graph?g0.expr=sum%20by%20%28gen_ai_operation_name%29%20%28increase%28gen_ai_client_token_usage_sum%7Bjob%3D%22settlement-agent%22%7D%5B1h%5D%29%29&g0.tab=0&g0.stacked=0&g0.range_input=1h"
      title: LLM tokens by operation
      icon: dashboard
    - url: "http://localhost:9090/graph?g0.expr=sum%28increase%28operation_cost_sum%7Bjob%3D%22settlement-agent%22%7D%5B1h%5D%29%29&g0.tab=0&g0.stacked=0&g0.range_input=1h"
      title: Model cost (last hour)
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: guests
  system: northstar
  dependsOn:
    - resource:agentgateway
    - component:payments-mcp
  providesApis: [settlement-agent-card]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: settlement-agent-card
  description: >-
    settlement-agent's A2A agent card. Its full definition (protocolVersion,
    skills, capabilities) lives in
    contracts/agent-cards/settlement-agent.json -- read that file, not the
    `definition` field below, for the actual contract; see
    agents/claims-agent/catalog-info.yaml's header comment for why it is not
    inlined here.
spec:
  type: agent-card
  lifecycle: production
  owner: guests
  system: northstar
  definition: |
    See contracts/agent-cards/settlement-agent.json in this repo for the
    full A2A AgentCard.
